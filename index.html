function attachDesktopSettingsHandlers() {
  const root = document.getElementById('hubRoot');
  root.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => { hubNavTab = el.dataset.nav; render(); });
  });
  // Player name
  const sn = root.querySelector('#setName');
  if (sn) sn.addEventListener('input', e => { state.name = e.target.value || 'Hero'; save(); });

  // Settings inputs auto-save
  const bindings = [
    ['cfgSecPlusDate', v => state.settings.secPlusDate = v || state.settings.secPlusDate],
    ['cfgTiktokNow',    v => state.settings.tiktokNow    = +v || 0],
    ['cfgTiktokGoal',   v => state.settings.tiktokGoal   = +v || 1000],
    ['cfgInstagramNow', v => state.settings.instagramNow = +v || 0],
    ['cfgInstagramGoal',v => state.settings.instagramGoal= +v || 1000],
    ['cfgYoutubeNow',   v => state.settings.youtubeNow   = +v || 0],
    ['cfgYoutubeGoal',  v => state.settings.youtubeGoal  = +v || 1000],
    ['cfgPostsNow',     v => state.lifetime.posts        = +v || 0],
    ['cfgPostsGoal',    v => state.settings.postsGoal    = +v || 100],
  ];
  bindings.forEach(([id, apply]) => {
    const el = root.querySelector('#' + id);
    if (!el) return;
    const handler = () => {
      apply(el.value);
      checkAchievements(); save();
      el.classList.add('saved-flash');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('saved-flash'), 600);
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });

  // Quest editor inputs
  root.querySelectorAll('[data-qe]').forEach(el => {
    const [cat, id, field] = el.dataset.qe.split('|');
    el.addEventListener('input', () => {
      const q = (state.quests[cat] || []).find(x => x.id === id);
      if (!q) return;
      if (field === 'xp') q.xp = Math.max(0, parseInt(el.value, 10) || 0);
      else q[field] = el.value;
      save();
      el.classList.add('saved-flash');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('saved-flash'), 600);
    });
  });

  // Custom boss inputs
  root.querySelectorAll('[data-cb]').forEach(el => {
    const [id, field] = el.dataset.cb.split('|');
    el.addEventListener('input', () => {
      const b = (state.customBosses || []).find(x => x.id === id);
      if (!b) return;
      if (field === 'name' || field === 'date') b[field] = el.value;
      else b[field] = Math.max(0, +el.value || 0);
      save();
      el.classList.add('saved-flash');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('saved-flash'), 600);
    });
  });

  // Action buttons
  root.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => handleSettingsAction(el.dataset.action, el));
  });
}

function handleSettingsAction(action, el) {
  if (action === 'set-theme') { setTheme(el.dataset.theme); return; }
  if (action === 'toggle-theme') { setTheme(state.theme === 'light' ? 'dark' : 'light'); return; }
  if (action === 'redo-onboarding') {
    if (!confirm('Redo onboarding? Your progress (XP, streaks, completions) is preserved — only your goals, classes, and quest list are reset to whatever you pick.')) return;
    state.onboarded = false;
    Object.assign(wiz, { step: 0, name: state.name || '', tagline: '', showAddClass: false, addingBossFor: null });
    save();
    render();
    return;
  }
  if (action === 'add-quest') {
    const cat = el.dataset.cat;
    state.quests[cat] = state.quests[cat] || [];
    state.quests[cat].push({ id: uid('q'), label: 'New quest', xp: 10 });
    save(); render();
    return;
  }
  if (action === 'delete-quest') {
    if (!confirm('Delete this quest? Past completions stay.')) return;
    const cat = el.dataset.cat, id = el.dataset.id;
    state.quests[cat] = (state.quests[cat] || []).filter(q => q.id !== id);
    save(); render();
    return;
  }
  if (action === 'reset-quests-defaults') {
    if (!confirm('Replace all your quests with the original defaults?')) return;
    state.quests = JSON.parse(JSON.stringify(DEFAULT_QUESTS));
    save(); render();
    return;
  }
  if (action === 'toggle-active-class') {
    const id = el.dataset.id;
    state.activeClasses[id] = !state.activeClasses[id] ? true : false;
    save(); render();
    return;
  }
  if (action === 'remove-class') {
    const id = el.dataset.id;
    if (!confirm('Remove this custom class? Its quests and bosses will be deleted. Past completions stay.')) return;
    state.customClasses = state.customClasses.filter(c => c.id !== id);
    delete state.activeClasses[id];
    delete state.quests[id];
    state.customBosses = (state.customBosses || []).filter(b => b.classId !== id);
    save(); render();
    return;
  }
  if (action === 'delete-cboss') {
    const id = el.dataset.id;
    if (!confirm('Delete this custom boss?')) return;
    state.customBosses = (state.customBosses || []).filter(b => b.id !== id);
    save(); render();
    return;
  }
  if (action === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `life-quest-${state.today}.json`; a.click();
    URL.revokeObjectURL(url);
    return;
  }
  if (action === 'import') {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const s = JSON.parse(r.result);
          if (!confirm('Replace current state with imported data?')) return;
          state = mergeWithDefaults(s); save(); render(); toast('IMPORTED', 'Save restored.');
        } catch (err) { alert('Bad file: ' + err.message); }
      };
      r.readAsText(file);
    };
    inp.click();
    return;
  }
  if (action === 'hardReset') {
    if (!confirm('Wipe ALL progress and start fresh? This cannot be undone.')) return;
    if (!confirm('Really sure? All XP, streaks, achievements gone.')) return;
    try { localStorage.removeItem(STATE_KEY); } catch {}
    state = defaultState(); save(); render();
    toast('RESET', 'Fresh start. Go.');
    return;
  }
}

function mhRenderToday() {
  const date = getSelectedDate();
  const viewingToday = isViewingToday();
  const dPretty = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  // Class chips
  const combat = activeCombatClasses();
  const chipsCols = Math.min(3, Math.max(1, combat.length));
  const chips = combat.map(c => {
    const xp = state.xp[c.id] || 0;
    const lvl = levelForXP(xp);
    const cur = xp - xpForLevel(lvl);
    const streak = state.streaks[c.id] || 0;
    return `
      <div class="mhub-chip" style="--c:${c.color}">
        <div class="top"><h4>${escapeHtml(c.name.slice(0, 6))}</h4><div class="lvl">${lvl}</div></div>
        <div class="bar"><div style="width:${cur}%"></div></div>
        <div class="meta">${cur}/100 · ${streak}d</div>
      </div>`;
  }).join('') || `<div style="grid-column:1/-1;color:var(--dim);font-size:12px;text-align:center;padding:8px;">No classes equipped.</div>`;

  // Date picker — small row above quests
  const dateRow = `
    <div style="display:flex;align-items:center;gap:10px;padding:12px 18px 4px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px;">
      <span>VIEWING</span>
      <input type="date" id="mhDatePicker" value="${date}" max="${state.today}" style="background:var(--input-bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--text);font:inherit;font-size:13px;font-family:'JetBrains Mono',monospace;flex:1;" />
      ${viewingToday ? '' : `<button class="hub-btn" data-action="back-to-today" style="padding:6px 10px;font-size:11px;">TODAY</button>`}
    </div>`;
  const pastBanner = viewingToday ? '' : `
    <div style="margin:0 18px 4px;background:var(--surface-2);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;">
      <span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--warn);font-family:'JetBrains Mono',monospace;font-weight:700;">Editing ${dPretty}</span>
      <span style="font-size:11px;color:var(--dim);">XP at base · streaks unchanged</span>
    </div>`;

  const c = state.completions[date] || {};
  const totalDone = Object.values(c).reduce((n, arr) => n + (arr || []).length, 0);

  const cats = activeQuestCats();
  const catsHtml = cats.map(cat => {
    const list = state.quests[cat.id] || [];
    const doneCount = (c[cat.id] || []).length;
    const weighIn = (cat.id === 'fit' && viewingToday) ? mhRenderWeighIn() : '';
    const items = list.map(q => {
      const done = isDone(cat.id, q.id);
      return `
        <div class="mhub-q ${done ? 'on' : ''}" data-toggle="${cat.id}|${q.id}">
          <span class="chk"></span>
          <span class="lbl">${escapeHtml(q.label)}</span>
          <span class="xp">+${q.xp}</span>
        </div>`;
    }).join('') || `<div style="color:var(--dim);font-size:12px;padding:10px 18px;">No quests. Add some from Profile → Customize quests.</div>`;
    return `
      <div class="mhub-cat" style="--c:${cat.color}">
        <div class="mhub-cat-h">${escapeHtml(cat.name)} <span class="num">${doneCount}/${list.length}</span></div>
        ${weighIn}
        ${items}
      </div>`;
  }).join('');

  return `
    <div class="mhub-classes" style="grid-template-columns:repeat(${chipsCols}, 1fr);">${chips}</div>
    ${dateRow}
    ${pastBanner}
    <div class="mhub-sec"><h2>${viewingToday ? "Today's Quests" : "Quests · " + dPretty}</h2><span class="count">${totalDone} done</span></div>
    ${catsHtml}
    <div class="mhub-cta">
      <button data-action="endDay" ${viewingToday ? '' : 'disabled style="opacity:.4"'}>${viewingToday ? 'End Day · Lock Streak' : 'End Day (today only)'}</button>
      <button class="ghost" data-action="resetToday">${viewingToday ? 'Reset today' : 'Reset this day'}</button>
    </div>`;
}

function mhRenderWeighIn() {
  const w = state.weights[state.today] || {};
  const d = new Date(state.today + 'T00:00:00');
  const yest = new Date(d); yest.setDate(yest.getDate() - 1);
  const yw = state.weights[todayStr(yest)] || {};
  let deltaStr = '—', upCls = '';
  if (typeof w.am === 'number' && typeof yw.am === 'number') {
    const diff = w.am - yw.am;
    deltaStr = (diff >= 0 ? '+' : '') + diff.toFixed(1);
    upCls = diff > 0.05 ? 'up' : '';
  }
  return `
    <div class="mhub-weigh">
      <div><label>AM</label><input type="number" step="0.1" min="0" id="mwAM" value="${w.am ?? ''}" /></div>
      <div><label>PM</label><input type="number" step="0.1" min="0" id="mwPM" value="${w.pm ?? ''}" /></div>
      <div class="delta ${upCls}">${deltaStr}<span class="l">delta</span></div>
    </div>`;
}

function mhRenderStats() {
  const cells = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(state.today + 'T00:00:00'); d.setDate(d.getDate() - i);
    const k = todayStr(d);
    const cc = state.completions[k] || {};
    const count = Object.values(cc).reduce((n, arr) => n + (arr || []).length, 0);
    let cls = '';
    if (count >= 1) cls = 'l1';
    if (count >= 4) cls = 'l2';
    if (count >= 8) cls = 'l3';
    if (count >= 12) cls = 'l4';
    if (k === state.today) cls += ' today';
    cells.push(`<div class="c ${cls}" data-heatjump="${k}" title="${k} — ${count} · tap to edit" style="cursor:pointer"></div>`);
  }
  const unlocked = Object.keys(state.achievements).length;
  return `
    <div class="mhub-sec"><h2>Lifetime</h2></div>
    <div class="mhub-tiles">
      ${[
        ['Lifts logged', state.lifetime.lifts || 0],
        ['Posts shipped', state.lifetime.posts || 0],

        ['Labs cleared', state.lifetime.labs || 0],
        ['Full days', state.lifetime.allCategoryDays || 0],

    <div class="mhub-ach">

}

function attachMobileHubHandlers() {
  const root = document.getElementById('mhubRoot');
  root.querySelectorAll('[data-mtab]').forEach(el => {
    el.addEventListener('click', () => setMhubTab(el.dataset.mtab));
  });
  // Past-day picker
  const mdp = root.querySelector('#mhDatePicker');
  if (mdp) mdp.addEventListener('change', () => { setSelectedDate(mdp.value); renderMobileHub(); });
  // Heatmap cells — tap to jump to Today on that day
  root.querySelectorAll('[data-heatjump]').forEach(el => {
    el.addEventListener('click', () => {
      setSelectedDate(el.dataset.heatjump);
      mhubTab = 'today';
      mhubSubScreen = null;
      renderMobileHub();
    });
  });
  root.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const [cat, id] = el.dataset.toggle.split('|');
      toggleQuest(cat, id);
    });
  });
  root.querySelectorAll('[data-boss-action]').forEach(el => {
    el.addEventListener('click', () => {
      const b = bossList().find(x => x.id === el.dataset.bossAction);
      if (b && b.onAction) b.onAction();
    });
  });
  root.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => handleMobileAction(el.dataset.action, el));
  });
  // Weigh-in
  const am = root.querySelector('#mwAM'), pm = root.querySelector('#mwPM');
  if (am) am.addEventListener('change', () => mhSetWeight('am', am.value));
  if (pm) pm.addEventListener('change', () => mhSetWeight('pm', pm.value));
  // Name
  const nm = root.querySelector('#mhName');
  if (nm) nm.addEventListener('input', e => { state.name = e.target.value || 'Hero'; save(); });
  // Boss inputs
  [['mhSecDate',  v => state.settings.secPlusDate    = v || state.settings.secPlusDate],
   ['mhTikNow',   v => state.settings.tiktokNow      = +v || 0],
   ['mhTikGoal',  v => state.settings.tiktokGoal     = +v || 1000],
   ['mhIgNow',    v => state.settings.instagramNow   = +v || 0],
   ['mhIgGoal',   v => state.settings.instagramGoal  = +v || 1000],
   ['mhYtNow',    v => state.settings.youtubeNow     = +v || 0],
   ['mhYtGoal',   v => state.settings.youtubeGoal    = +v || 1000],
   ['mhPostsNow', v => state.lifetime.posts          = +v || 0],
   ['mhPostsGoal',v => state.settings.postsGoal      = +v || 100]].forEach(([id, apply]) => {
    const el = root.querySelector('#' + id);
    if (!el) return;
    const handler = () => { apply(el.value); checkAchievements(); save(); el.classList.add('saved-flash'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('saved-flash'), 600); };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  // Quest editor inputs
  root.querySelectorAll('[data-qe]').forEach(el => {
    const [cat, id, field] = el.dataset.qe.split('|');
    el.addEventListener('input', () => {
      const q = (state.quests[cat] || []).find(x => x.id === id);
      if (!q) return;
      if (field === 'xp') q.xp = Math.max(0, parseInt(el.value, 10) || 0);
      else q[field] = el.value;
      save();
    });
  });
  // Custom boss inputs
  root.querySelectorAll('[data-cb]').forEach(el => {
    const [id, field] = el.dataset.cb.split('|');
    el.addEventListener('input', () => {
      const b = (state.customBosses || []).find(x => x.id === id);
      if (!b) return;
      if (field === 'name' || field === 'date') b[field] = el.value;
      else b[field] = Math.max(0, +el.value || 0);
      save();
    });
  });
}

function mhSetWeight(key, raw) {
  state.weights[state.today] = state.weights[state.today] || {};
  const t = raw.trim ? raw.trim() : raw;
  if (t === '' || t == null) delete state.weights[state.today][key];
  else {
    const v = parseFloat(t);
    if (isFinite(v) && v > 0) state.weights[state.today][key] = v;
  }
  save();
  renderMobileHub();
}

function handleMobileAction(action, el) {
  if (action === 'endDay') {
    if (!isViewingToday()) { toast('NOT TODAY', 'Switch to today to end the day.'); return; }
    endDay(); return;
  }
  if (action === 'resetToday') { resetToday(); return; }
  if (action === 'back-to-today') { setSelectedDate(state.today); renderMobileHub(); return; }
  if (action === 'goto-quest-editor') { mhubSubScreen = 'quest-editor'; renderMobileHub(); return; }
  if (action === 'goto-class-editor') { mhubSubScreen = 'class-editor'; renderMobileHub(); return; }
  if (action === 'goto-boss-editor')  { mhubSubScreen = 'boss-editor';  renderMobileHub(); return; }
  if (action === 'back-to-profile')   { mhubSubScreen = null; mhubTab = 'profile'; renderMobileHub(); return; }
  if (action === 'sign-out') { try { location.href = '/cdn-cgi/access/logout'; } catch {} return; }
  if (action === 'toggle-active-class') {
    const id = el.dataset.id;
    state.activeClasses[id] = !state.activeClasses[id] ? true : false;
    save(); renderMobileHub();
    return;
  }
  // Delegate to shared settings actions
  handleSettingsAction(action, el);
}
/* (No additional Settings code — handlers are inline with their renderers.) */
/* ============================================================
   Init
   ============================================================ */

function isMobile() {
  return window.matchMedia('(max-width: 768px)').matches;
}

// Re-render when viewport crosses the mobile breakpoint so layout adapts
// without a manual refresh. Debounced to avoid thrashing during drags.
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // Only re-render the active mode; wizard renders both layouts itself.
    if (!state.onboarded) renderWizard();
    else if (isMobile()) {
      document.getElementById('hubRoot').hidden = true;
      renderMobileHub();
    } else {
      document.getElementById('mhubRoot').hidden = true;
      renderDesktopHub();
    }
  }, 150);
});

// Roll the date every minute so an open tab doesn't get stuck on yesterday
setInterval(() => {
  const before = state.today;
  rollDateIfNeeded();
  if (state.today !== before) render();
}, 60_000);

(async function init() {
  setSyncStatus('syncing');
  state = await loadFromApi();
  applyTheme();
  _signedInEmail = await fetchSignedInEmail();
  if (!_signedInEmail) setSyncStatus('offline'); else setSyncStatus('synced');
  // Seed wizard with state.name when redoing onboarding
  if (!state.onboarded) {
    wiz.name = state.name && state.name !== 'Hero' ? state.name : '';
    wiz.classes = { ...wiz.classes, ...state.activeClasses };
    wiz.customClasses = (state.customClasses || []).slice();
    wiz.bosses.secPlusDate = state.settings.secPlusDate || wiz.bosses.secPlusDate;
    wiz.bosses.tiktokNow = state.settings.tiktokNow || 0;
    wiz.bosses.tiktokGoal = state.settings.tiktokGoal || 1000;
    wiz.bosses.instagramNow = state.settings.instagramNow || 0;
    wiz.bosses.instagramGoal = state.settings.instagramGoal || 1000;
    wiz.bosses.youtubeNow = state.settings.youtubeNow || 0;
    wiz.bosses.youtubeGoal = state.settings.youtubeGoal || 1000;
    wiz.bosses.postsGoal = state.settings.postsGoal || 100;
    // Pre-fill enabled set from existing quests so a redo doesn't blow them away
    if (state.quests) {
      Object.keys(state.quests).forEach(cat => {
        wiz.enabled[cat] = new Set((state.quests[cat] || []).map(q => q.id));
      });
    }
  }
  render();
})();


</script>
