<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d14" />
<title>Life Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
<style>
/* ============================================================
   Life Quest v3 — design tokens + base
   Two adjacent palettes:
     LQ_*  → legacy/wizard colors (rainbow avatar, etc.)
     HUB_* → refined hub colors (restrained, dividers, mono)
   ============================================================ */
:root {
  /* HUB palette — the new main app */
  --bg:        #0a0d14;
  --surface:   #0f1422;
  --surface-2: #141a2b;
  --line:      #1e2740;
  --line-soft: #161d31;
  --text:      #e8edf7;
  --muted:     #8290b0;
  --dim:       #4d587a;
  --fit:       #ff5d7a;
  --content:   #b96bff;
  --cyber:     #3fd0ff;
  --good:      #5cd994;
  --warn:      #ffb74d;
  --life:      #ffd24a;
  --bad:       #ff5468;
  --accent:    #6cf;

  /* Glow tints — only used by wizard rainbow avatar */
  --fit-glow:     #ff5d7a55;
  --content-glow: #b96bff55;
  --cyber-glow:   #3fd0ff55;

  /* Semi-transparent tint variants used by glass / overlay surfaces.
     Dark mode = near-black with alpha; light mode flips to near-white. */
  --tab-bar-bg:   rgba(10, 13, 20, .92);
  --foot-bar-bg:  rgba(10, 13, 20, .95);
  --boss-card-bg: linear-gradient(180deg, #1a1226, #0e1624);
  --input-bg:     #0a121d;
}

[data-theme="light"] {
  --bg:        #f5f7fb;
  --surface:   #ffffff;
  --surface-2: #eef1f7;
  --line:      #d4d9e4;
  --line-soft: #e7eaf2;
  --text:      #1a1f2e;
  --muted:     #5b6680;
  --dim:       #8d96ad;
  --fit:       #d8335c;
  --content:   #8d3eda;
  --cyber:     #0d96c0;
  --good:      #2d9d56;
  --warn:      #c98715;
  --life:      #b88507;
  --bad:       #d8335c;
  --accent:    #0d96c0;
  --fit-glow:     #d8335c33;
  --content-glow: #8d3eda33;
  --cyber-glow:   #0d96c033;
  --tab-bar-bg:   rgba(255, 255, 255, .92);
  --foot-bar-bg:  rgba(255, 255, 255, .95);
  --boss-card-bg: linear-gradient(180deg, #f5e9ff, #ffffff);
  --input-bg:     #ffffff;
}
[data-theme="light"] html, [data-theme="light"] body { background: var(--bg); }
/* Light-mode tweaks for elements that hardcoded near-black backgrounds */
[data-theme="light"] .wz input[type=text],
[data-theme="light"] .wz input[type=number],
[data-theme="light"] .wz input[type=date] { background: var(--input-bg); }
[data-theme="light"] .wz-icons button,
[data-theme="light"] .wz-class .ic-custom,
[data-theme="light"] .wz-class .toggle,
[data-theme="light"] .wz-quest,
[data-theme="light"] .wz-recap-stat,
[data-theme="light"] .lq-pill,
[data-theme="light"] .wz-addclass-tile .plus,
[data-theme="light"] .wz-step .n { background: var(--input-bg); }
[data-theme="light"] .wz-class { background: var(--surface); }
[data-theme="light"] .wz-quest { background: var(--surface); }
[data-theme="light"] .wz-quest.on { background: var(--surface-2); }
[data-theme="light"] .wz-quest:hover { background: var(--surface-2); }
[data-theme="light"] .wz-addboss-form .kind-toggle,
[data-theme="light"] .mwiz-addboss-form .kind { background: var(--surface-2); }
[data-theme="light"] .wz-addclass-form,
[data-theme="light"] .wz-addboss-form,
[data-theme="light"] .mwiz-addclass-form,
[data-theme="light"] .mwiz-addboss-form { background: var(--surface); }
[data-theme="light"] .wz-step.active { background: var(--surface-2); }
[data-theme="light"] .wz-boss { background: var(--boss-card-bg); }
[data-theme="light"] .wz-recap-card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
[data-theme="light"] .lq-btn { background: var(--surface-2); }
[data-theme="light"] .lq-btn:hover { background: var(--surface); }
[data-theme="light"] .hub-btn:hover { background: var(--surface-2); }
[data-theme="light"] .hub-bg-radial { display: none; }
[data-theme="light"] .wz-scope {
  background: var(--bg);
}
[data-theme="light"] .mhub-tabs { background: var(--tab-bar-bg); }
[data-theme="light"] .mwiz-foot { background: var(--foot-bar-bg); }
[data-theme="light"] input::placeholder, [data-theme="light"] textarea::placeholder { color: var(--dim); }
[data-theme="light"] .hub-avatar, [data-theme="light"] .mhub-top .av,
[data-theme="light"] .mwiz-av, [data-theme="light"] .mwiz-recap-hero .av { background: var(--surface-2); }
[data-theme="light"] .hub-mark .dot { box-shadow: 0 0 0 1px var(--cyber); }
[data-theme="light"] .hub-stat .big { color: var(--text); }
[data-theme="light"] .hub-heat .c { background: #eaedf3; }
[data-theme="light"] .hub-heat .c.l1 { background: #c8d0dc; }
[data-theme="light"] .hub-heat .c.l2 { background: #6f8eb8; }
[data-theme="light"] .hub-heat .c.l3 { background: #0d96c099; }
[data-theme="light"] .hub-heat .c.l4 { background: var(--cyber); }
[data-theme="light"] .mhub-heat .c { background: #eaedf3; }
[data-theme="light"] .mhub-heat .c.l1 { background: #c8d0dc; }
[data-theme="light"] .mhub-heat .c.l2 { background: #6f8eb8; }
[data-theme="light"] .mhub-heat .c.l3 { background: #0d96c099; }
[data-theme="light"] .mhub-heat .c.l4 { background: var(--cyber); }
[data-theme="light"] .hub-heat-key .k.l1 { background: #c8d0dc; }
[data-theme="light"] .hub-heat-key .k.l2 { background: #6f8eb8; }
[data-theme="light"] .hub-heat-key .k.l3 { background: #0d96c099; }
[data-theme="light"] .hub-heat-key .k.l4 { background: var(--cyber); }
[data-theme="light"] .wz-class.on .toggle { color: #fff; }
[data-theme="light"] .hub-q.on .lbl { color: var(--dim); }
[data-theme="light"] .toast { box-shadow: 0 0 24px rgba(0,0,0,.08), 0 8px 28px rgba(0,0,0,.12); }

/* Light-mode: meta theme-color so iOS chrome flips too */
[data-theme="light"] meta[name="theme-color"] { content: "#f5f7fb"; }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, "Segoe UI", system-ui, sans-serif;
  overscroll-behavior: none;
}
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.mono { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; }

/* Scoped scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 100px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* Hide containers until init decides which to show */
[hidden] { display: none !important; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: var(--surface); border: 1px solid var(--life);
  border-radius: 10px; padding: 12px 16px;
  box-shadow: 0 0 20px #ffd24a44;
  opacity: 0; transform: translateY(12px);
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none; min-width: 220px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast .t {
  font-weight: 700; color: var(--life); font-size: 11px;
  letter-spacing: 1.5px; text-transform: uppercase;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.toast .m { font-size: 13px; margin-top: 4px; }
@media (max-width: 768px) {
  .toast { left: 12px; right: 12px; bottom: 12px; min-width: 0; }
}

/* ============================================================
   ▒▒▒ WIZARD CSS (desktop) ▒▒▒
   ============================================================ */
.wz-scope {
  position: fixed; inset: 0; overflow-y: auto;
  background:
    radial-gradient(1200px 700px at 10% -10%, #1a2c4f33, transparent 60%),
    radial-gradient(900px 600px at 110% 0%, #4b1a6633, transparent 60%),
    radial-gradient(900px 700px at 50% 120%, #0f3a4233, transparent 60%),
    var(--bg);
}
.wz {
  max-width: 1280px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column;
  padding: 36px 56px 28px;
}
.wz-top {
  display: flex; align-items: center; gap: 16px;
  padding-bottom: 18px; border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
.wz-mark {
  width: 36px; height: 36px; border-radius: 9px;
  background: conic-gradient(from 220deg, var(--fit), var(--content), var(--cyber), var(--fit));
  box-shadow: 0 0 18px #3fd0ff44, 0 0 18px #b96bff44;
}
.wz-mark-title { font-weight: 800; font-size: 15px; letter-spacing: 2.5px; text-transform: uppercase; }
.wz-mark-sub {
  font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-steps { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.wz-step {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 100px;
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--dim); border: 1px solid transparent;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-step.done { color: var(--good); }
.wz-step.active { color: var(--text); background: var(--surface); border-color: var(--line); }
.wz-step .n {
  width: 18px; height: 18px; display: grid; place-items: center;
  border-radius: 50%; background: #0a121d; border: 1px solid currentColor;
  font-size: 10px; font-weight: 800;
}
.wz-step.done .n { background: var(--good); color: var(--bg); border-color: var(--good); }

.wz-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wz-stepnum {
  font-size: 11px; letter-spacing: 4px; color: var(--dim);
  text-transform: uppercase; font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-h1 { font-size: 34px; font-weight: 800; letter-spacing: -.5px; margin: 6px 0 6px; }
.wz-h1 .accent { color: var(--cyber); }
.wz-lede { color: var(--muted); font-size: 15px; max-width: 640px; line-height: 1.5; margin-bottom: 26px; }

.wz-foot {
  display: flex; align-items: center; gap: 14px;
  padding-top: 18px; border-top: 1px solid var(--line); margin-top: 18px;
}
.wz-foot .spacer { flex: 1; }
.wz-progress { flex: 0 0 220px; display: flex; flex-direction: column; gap: 4px; }
.wz-progress .lbl {
  font-size: 10px; letter-spacing: 2px; color: var(--dim);
  text-transform: uppercase; font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-pbar {
  height: 6px; background: var(--line-soft); border-radius: 100px; overflow: hidden;
}
.wz-pbar > div {
  height: 100%; background: var(--cyber); transition: width .35s ease;
  box-shadow: 0 0 12px var(--cyber-glow);
}

/* Buttons */
.lq-btn {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 10px;
  font: inherit; font-weight: 600; font-size: 13px;
  letter-spacing: .3px; cursor: pointer; transition: all .15s ease;
}
.lq-btn:hover { border-color: var(--accent); background: #243049; }
.lq-btn.primary {
  background: linear-gradient(180deg, #3fd0ff22, #3fd0ff11);
  border-color: var(--cyber); color: var(--cyber);
}
.lq-btn.primary:hover { background: var(--cyber); color: var(--bg); }
.lq-btn.ghost { background: transparent; border-style: dashed; color: var(--muted); }
.lq-btn.ghost:hover { color: var(--text); }
.lq-btn:disabled { opacity: .35; cursor: not-allowed; }

/* Inputs (wizard) */
.wz input[type=text], .wz input[type=number], .wz input[type=date] {
  background: #0a121d; border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); padding: 10px 12px; font: inherit; font-size: 14px; width: 100%;
  outline: none; transition: border-color .15s ease;
}
.wz input:focus { border-color: var(--accent); }
.wz label.lq-lbl {
  display: block; font-size: 11px; letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase; margin: 0 0 6px;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.lq-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 100px; font-size: 11px;
  background: #0e1624; border: 1px solid var(--line); color: var(--muted);
  letter-spacing: 1px; text-transform: uppercase;
}
.lq-pill.fit     { color: var(--fit);     border-color: var(--fit); }
.lq-pill.content { color: var(--content); border-color: var(--content); }
.lq-pill.cyber   { color: var(--cyber);   border-color: var(--cyber); }
.lq-pill.life    { color: var(--life);    border-color: var(--life); }

/* Step 1 — Identity */
.wz-identity { display: grid; grid-template-columns: 280px 1fr; gap: 40px; align-items: start; }
.wz-avatar {
  width: 240px; height: 240px; border-radius: 28px;
  background: conic-gradient(from 220deg, var(--fit), var(--content), var(--cyber), var(--fit));
  display: grid; place-items: center;
  font-size: 96px; font-weight: 900; color: var(--bg);
  box-shadow: 0 0 60px #3fd0ff33, 0 0 60px #b96bff33, inset 0 0 30px #fff3;
  letter-spacing: -4px;
}
.wz-avatar-cap {
  text-align: center; margin-top: 12px; font-size: 11px; letter-spacing: 2px;
  color: var(--dim); text-transform: uppercase;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-field { margin-bottom: 18px; }
.wz-field input { font-size: 18px !important; padding: 14px 16px !important; }

/* Step 2 — classes */
.wz-classes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.wz-class {
  --c: var(--muted); --cg: transparent;
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 20px;
  cursor: pointer; transition: all .2s ease;
  display: flex; flex-direction: column;
}
.wz-class .x-remove {
  position: absolute; top: 10px; right: 10px;
  width: 24px; height: 24px; border-radius: 6px;
  background: transparent; border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1;
  display: grid; place-items: center; z-index: 2;
}
.wz-class .x-remove:hover { color: var(--bad); border-color: var(--bad); background: #ff546822; }
.wz-class::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(400px 120px at 50% -10%, var(--cg), transparent 70%);
  opacity: 0; transition: opacity .25s ease;
}
.wz-class.on::before { opacity: 1; }
.wz-class.on { border-color: var(--c); box-shadow: 0 0 20px var(--cg) inset, 0 0 28px var(--cg); }
.wz-class:hover { transform: translateY(-2px); }
.wz-class .ic { font-size: 30px; }
.wz-class .ic-custom {
  width: 44px; height: 44px; border-radius: 11px;
  background: #0a121d; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 22px; margin-bottom: 8px;
}
.wz-class.on .ic-custom { border-color: var(--c); }
.wz-class h3 {
  margin: 12px 0 4px; font-size: 13px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--c);
}
.wz-class .name { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.wz-class .tag {
  font-size: 11px; letter-spacing: 1px; color: var(--muted);
  margin-bottom: 12px; font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-class .blurb { font-size: 13px; line-height: 1.5; color: var(--muted); margin-bottom: 14px; }
.wz-class .toggle {
  margin-top: auto; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: #0e1624;
  font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
}
.wz-class.on .toggle { background: var(--c); color: var(--bg); border-color: var(--c); }
.wz-class .check {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid currentColor; display: grid; place-items: center;
}
.wz-class.on .check { background: var(--bg); color: var(--c); }
.wz-class.on .check::after { content: '✓'; font-weight: 900; font-size: 10px; }

.wz-addclass-tile {
  background: transparent; border: 1px dashed var(--line);
  border-radius: 16px; padding: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); cursor: pointer; font: inherit;
  text-align: center; min-height: 230px;
  transition: all .15s ease;
}
.wz-addclass-tile:hover { color: var(--text); border-color: var(--accent); }
.wz-addclass-tile .plus {
  width: 36px; height: 36px; border-radius: 10px;
  background: #0e1624; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 18px;
}
.wz-addclass-tile h4 { margin: 0; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }
.wz-addclass-tile p { margin: 0; font-size: 12px; max-width: 200px; line-height: 1.5; }

.wz-addclass-form {
  background: var(--surface); border: 1px solid var(--accent); border-radius: 16px;
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
}
.wz-addclass-form .ttl {
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
  font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700;
}
.wz-icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.wz-icons button {
  aspect-ratio: 1; background: #0a121d; border: 1px solid var(--line);
  border-radius: 6px; cursor: pointer; font-size: 18px;
  display: grid; place-items: center; padding: 0; color: var(--text);
}
.wz-icons button.on { border-color: var(--accent); background: var(--surface-2); }
.wz-icons button:hover { border-color: var(--accent); }
.wz-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.wz-swatches button {
  aspect-ratio: 1; border-radius: 6px; cursor: pointer; padding: 0;
  border: 2px solid transparent; outline: 1px solid var(--line); outline-offset: -1px;
  background: var(--c);
}
.wz-swatches button.on { outline: 2px solid #fff; outline-offset: 2px; }
.wz-form-row { display: flex; gap: 8px; }
.wz-form-row .lq-btn { flex: 1; }

/* Step 3 — bosses */
.wz-bosses { display: flex; flex-direction: column; gap: 22px; max-height: 100%; overflow-y: auto; padding-right: 6px; }
.wz-boss-class-group { display: flex; flex-direction: column; gap: 10px; }
.wz-boss-class-h {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  font-size: 11px; letter-spacing: 2px; color: var(--c, var(--muted));
  text-transform: uppercase; font-weight: 600;
}
.wz-boss-class-h::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c);
}
.wz-boss-class-h .name {
  color: var(--text); font-weight: 700; font-size: 14px;
  text-transform: none; letter-spacing: 0;
}
.wz-boss {
  --c: var(--muted); position: relative;
  background: linear-gradient(180deg, #1a1226, #0e1624);
  border: 1px solid var(--c);
  border-radius: 14px; padding: 16px 20px;
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
}
.wz-boss .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.wz-boss .head .icon { font-size: 22px; }
.wz-boss .name { font-weight: 800; font-size: 15px; }
.wz-boss .desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.wz-boss .field { display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
.wz-boss .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wz-boss .x-remove-boss {
  position: absolute; top: 8px; right: 8px;
  width: 22px; height: 22px; border-radius: 5px;
  background: transparent; border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
  display: grid; place-items: center; padding: 0;
}
.wz-boss .x-remove-boss:hover { color: var(--bad); border-color: var(--bad); }

.wz-addboss-btn {
  width: 100%; background: transparent; border: 1px dashed var(--c, var(--line));
  border-radius: 10px; padding: 10px;
  color: var(--c, var(--muted)); font: inherit; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
}
.wz-addboss-form {
  background: var(--surface); border: 1px solid var(--c, var(--accent)); border-radius: 12px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.wz-addboss-form .ttl {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--c, var(--accent));
  font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700;
}
.wz-addboss-form .kind-toggle {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: #0a121d; border-radius: 8px; padding: 3px;
}
.wz-addboss-form .kind-toggle button {
  padding: 8px; background: transparent; border: none;
  color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; border-radius: 6px;
}
.wz-addboss-form .kind-toggle button.on { background: var(--surface-2); color: var(--text); }
.wz-addboss-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wz-addboss-form .actions { display: flex; gap: 8px; }
.wz-addboss-form .actions button { flex: 1; }

/* Step 4 — quests */
.wz-quest-grid {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  overflow-y: auto; padding-right: 6px;
}
.wz-qcol {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; display: flex; flex-direction: column;
}
.wz-qcol h4 {
  margin: 0 0 4px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--c); display: flex; align-items: center; gap: 8px;
}
.wz-qcol .sum {
  font-size: 11px; color: var(--dim); letter-spacing: 1px;
  font-family: 'JetBrains Mono', Consolas, monospace; margin-bottom: 12px;
}
.wz-quest {
  display: grid; grid-template-columns: 24px 1fr 56px;
  align-items: center; gap: 10px;
  padding: 10px; border-radius: 10px;
  background: #0e1624; border: 1px solid var(--line);
  margin-bottom: 6px; cursor: pointer; transition: all .15s ease;
}
.wz-quest.on { border-color: var(--c); }
.wz-quest:hover { background: #131e2e; }
.wz-quest .chk {
  width: 18px; height: 18px; border-radius: 5px;
  border: 2px solid var(--c, var(--muted)); display: grid; place-items: center;
  color: var(--bg);
}
.wz-quest.on .chk { background: var(--c); box-shadow: 0 0 8px var(--cg); }
.wz-quest.on .chk::after { content: '✓'; font-weight: 900; font-size: 11px; }
.wz-quest .lbl { font-size: 13px; }
.wz-quest.off .lbl { color: var(--dim); text-decoration: line-through; }
.wz-quest .xp {
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  text-align: right; color: var(--life);
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.wz-qcol .add { display: flex; gap: 6px; margin-top: 8px; }
.wz-qcol .add input { flex: 1; padding: 8px 10px !important; font-size: 12px !important; }
.wz-qcol .add button {
  padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--line);
  background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer;
}
.wz-qcol .add button:hover { color: var(--c); border-color: var(--c); }

/* Step 5 — embark */
.wz-recap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; flex: 1; min-height: 0; }
.wz-recap-card {
  background: linear-gradient(180deg, #14202f, #0e1624);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 24px; display: flex; flex-direction: column;
}
.wz-recap-hero {
  display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
  padding-bottom: 18px; border-bottom: 1px solid var(--line);
}
.wz-recap-hero .av {
  width: 64px; height: 64px; border-radius: 14px;
  background: conic-gradient(from 220deg, var(--fit), var(--content), var(--cyber), var(--fit));
  display: grid; place-items: center;
  font-size: 26px; font-weight: 900; color: var(--bg);
}
.wz-recap-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
}
.wz-recap-row:last-child { border-bottom: none; }
.wz-recap-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.wz-recap-stat {
  background: #0a121d; border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; text-align: center;
}
.wz-recap-stat .big { font-size: 26px; font-weight: 800; color: var(--c, var(--cyber)); line-height: 1; }
.wz-recap-stat .lbl {
  font-size: 10px; letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase; margin-top: 6px;
}
.wz-embark {
  margin-top: auto;
  background: linear-gradient(135deg, var(--fit) 0%, var(--content) 50%, var(--cyber) 100%);
  color: var(--bg); font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  border: none; padding: 18px; border-radius: 12px;
  font-size: 14px; cursor: pointer;
  box-shadow: 0 0 30px #3fd0ff55;
  transition: transform .15s ease;
}
.wz-embark:hover { transform: translateY(-2px); box-shadow: 0 0 40px #3fd0ff77; }

/* ============================================================
   ▒▒▒ WIZARD CSS (mobile) ▒▒▒
   ============================================================ */
.mwiz-scope {
  position: fixed; inset: 0;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  overflow: hidden;
}
.mwiz-prog {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 18px 16px;
  border-bottom: 1px solid var(--line);
}
.mwiz-prog .stp { flex: 1; height: 3px; background: var(--line-soft); border-radius: 2px; }
.mwiz-prog .stp.done { background: var(--cyber); }
.mwiz-prog .stp.active { background: var(--cyber); opacity: .6; }
.mwiz-prog .label {
  font-size: 10px; letter-spacing: 2px;
  font-family: 'JetBrains Mono', Consolas, monospace;
  color: var(--dim);
}
.mwiz-body {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 22px 22px calc(96px + env(safe-area-inset-bottom));
}
.mwiz-stp {
  font-size: 10px; letter-spacing: 3px; color: var(--dim);
  text-transform: uppercase; font-family: 'JetBrains Mono', Consolas, monospace;
}
.mwiz-h { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin: 8px 0 8px; }
.mwiz-h .ac { color: var(--cyber); }
.mwiz-lede { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }

.mwiz-fld { margin-bottom: 14px; }
.mwiz-fld label {
  display: block; font-size: 10px; letter-spacing: 2px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.mwiz-fld input, .mwiz-fld input[type=date] {
  width: 100%; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  color: var(--text); padding: 14px;
  font: inherit; font-size: 16px; outline: none;
}
.mwiz-fld input:focus { border-color: var(--cyber); }

.mwiz-av {
  width: 120px; height: 120px; border-radius: 24px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 52px; font-weight: 700; color: var(--text);
  letter-spacing: -2px; margin: 0 auto 22px; position: relative;
}
.mwiz-av .ring {
  position: absolute; inset: -4px; border-radius: 28px;
  border: 1px solid #3fd0ff55;
}

.mwiz-classes { display: flex; flex-direction: column; gap: 10px; }
.mwiz-class {
  --c: var(--muted);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px;
  display: grid; grid-template-columns: 44px 1fr 24px;
  align-items: center; gap: 14px;
  cursor: pointer; position: relative;
}
.mwiz-class .x-remove {
  position: absolute; top: 8px; right: 8px;
  width: 22px; height: 22px; border-radius: 5px;
  background: var(--bg); border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
  display: grid; place-items: center; padding: 0; z-index: 2;
}
.mwiz-class .x-remove:active { color: var(--fit); }
.mwiz-class.on { border-color: var(--c); }
.mwiz-class .ic {
  width: 44px; height: 44px; border-radius: 11px;
  background: var(--bg); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 22px;
}
.mwiz-class.on .ic { border-color: var(--c); }
.mwiz-class .name { font-size: 15px; font-weight: 700; }
.mwiz-class .tag {
  font-size: 11px; color: var(--muted); margin-top: 2px;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.mwiz-class .chk {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--c); display: grid; place-items: center;
  color: var(--bg);
}
.mwiz-class.on .chk { background: var(--c); }
.mwiz-class.on .chk::after { content: '✓'; font-weight: 700; font-size: 12px; }

.mwiz-addclass {
  background: transparent; border: 1px dashed var(--line);
  border-radius: 12px; padding: 18px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); cursor: pointer; font: inherit; width: 100%;
}
.mwiz-addclass .plus {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 14px;
}
.mwiz-addclass .ttl { font-size: 13px; font-weight: 600; }

.mwiz-addclass-form, .mwiz-addboss-form {
  background: var(--surface); border: 1px solid var(--cyber); border-radius: 12px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.mwiz-addclass-form .ttl, .mwiz-addboss-form .ttl {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--cyber);
  font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700;
}
.mwiz-addclass-form label, .mwiz-addboss-form label {
  display: block; font-size: 10px; letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 6px;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.mwiz-addclass-form input, .mwiz-addboss-form input {
  width: 100%; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px; color: var(--text);
  font: inherit; font-size: 15px; outline: none;
}
.mwiz-addclass-form input:focus, .mwiz-addboss-form input:focus { border-color: var(--cyber); }
.mwiz-iconbtns { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.mwiz-iconbtns button {
  aspect-ratio: 1; background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; cursor: pointer; font-size: 17px;
  display: grid; place-items: center; padding: 0; color: var(--text);
}
.mwiz-iconbtns button.on { border-color: var(--cyber); }
.mwiz-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.mwiz-swatches button {
  aspect-ratio: 1; border-radius: 7px; cursor: pointer; padding: 0;
  border: 2px solid transparent; outline: 1px solid var(--line); outline-offset: -1px;
  background: var(--c);
}
.mwiz-swatches button.on { outline: 2px solid #fff; outline-offset: 2px; }
.mwiz-addclass-form .actions, .mwiz-addboss-form .actions { display: flex; gap: 8px; }
.mwiz-addclass-form .actions button, .mwiz-addboss-form .actions button {
  flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.mwiz-addclass-form .actions button.primary, .mwiz-addboss-form .actions button.primary {
  background: var(--cyber); color: var(--bg); border-color: var(--cyber);
}
.mwiz-addclass-form .actions button:disabled, .mwiz-addboss-form .actions button:disabled { opacity: .35; }

.mwiz-bosses { display: flex; flex-direction: column; gap: 16px; }
.mwiz-bossgroup { display: flex; flex-direction: column; gap: 8px; }
.mwiz-bossgroup-h {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--c, var(--muted)); font-weight: 600; margin-bottom: 2px;
}
.mwiz-bossgroup-h::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c);
}
.mwiz-bossgroup-h .name {
  color: var(--text); text-transform: none; letter-spacing: 0;
  font-size: 14px; font-weight: 700;
}
.mwiz-boss {
  --c: var(--muted);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px;
  position: relative; border-left: 3px solid var(--c);
}
.mwiz-boss .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.mwiz-boss .name { font-size: 14px; font-weight: 600; }
.mwiz-boss .desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
.mwiz-boss input {
  width: 100%; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); padding: 10px; font: inherit; font-size: 14px;
  outline: none;
}
.mwiz-boss .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mwiz-boss .x-remove-boss {
  margin-left: auto;
  width: 22px; height: 22px; border-radius: 5px;
  background: var(--bg); border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-size: 13px;
  line-height: 1; display: grid; place-items: center; padding: 0; flex-shrink: 0;
}
.mwiz-addboss-btn {
  width: 100%; background: transparent; border: 1px dashed var(--c, var(--line));
  border-radius: 10px; padding: 12px;
  color: var(--c, var(--muted)); font: inherit; font-size: 13px; font-weight: 600;
  letter-spacing: .3px; cursor: pointer;
}
.mwiz-addboss-form .kind {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--bg); padding: 3px; border-radius: 8px;
}
.mwiz-addboss-form .kind button {
  background: transparent; border: none; color: var(--muted);
  padding: 9px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
}
.mwiz-addboss-form .kind button.on { background: var(--surface-2); color: var(--text); }
.mwiz-addboss-form .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.mwiz-qadd { display: flex; gap: 6px; margin-top: 8px; }
.mwiz-qadd input {
  flex: 1; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; color: var(--text);
  font: inherit; font-size: 13px; outline: none;
}
.mwiz-qadd input:focus { border-color: var(--c); }
.mwiz-qadd button {
  padding: 10px 14px; border-radius: 8px;
  background: transparent; border: 1px dashed var(--c, var(--line));
  color: var(--c, var(--muted)); font: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.mwiz-qsec { margin-bottom: 16px; }
.mwiz-qsec h4 {
  margin: 0 0 6px; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--c); font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.mwiz-qsec h4 .ct {
  margin-left: auto; color: var(--dim); font-weight: 500;
  font-family: 'JetBrains Mono', Consolas, monospace;
}
.mwiz-q {
  display: grid; grid-template-columns: 20px 1fr auto;
  align-items: center; gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line-soft);
  cursor: pointer;
}
.mwiz-q:first-of-type { border-top: none; }
.mwiz-q .chk {
  width: 20px; height: 20px; border-radius: 5px;
  border: 1.5px solid var(--c, var(--muted));
  display: grid; place-items: center; color: var(--bg);
}
.mwiz-q.on .chk { background: var(--c); }
.mwiz-q.on .chk::after { content: '✓'; font-weight: 700; font-size: 11px; }
.mwiz-q .lbl { font-size: 14px; line-height: 1.3; }
.mwiz-q.off .lbl { color: var(--dim); text-decoration: line-through; }
.mwiz-q .xp {
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: 11px; color: var(--life); font-weight: 700;
}
.mwiz-q .x-q {
  background: transparent; border: none; color: var(--dim);
  cursor: pointer; padding: 4px 8px; font-size: 14px; line-height: 1;
}
.mwiz-q .x-q:active { color: var(--fit); }

.mwiz-recap {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 18px; margin-bottom: 14px;
}
.mwiz-recap-hero {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding-bottom: 16px; border-bottom: 1px solid var(--line);
}
.mwiz-recap-hero .av {
  width: 48px; height: 48px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 20px; font-weight: 700;
}
.mwiz-recap-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
}
.mwiz-recap-stats .s {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; text-align: center;
}
.mwiz-recap-stats .v { font-size: 22px; font-weight: 700; line-height: 1; }
.mwiz-recap-stats .l {
  font-size: 9px; letter-spacing: 1.5px; color: var(--dim);
  text-transform: uppercase; margin-top: 6px;
  font-family: 'JetBrains Mono', Consolas, monospace;
}

.mwiz-foot {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 12px 22px calc(12px + env(safe-area-inset-bottom));
  background: rgba(10,13,20,.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex; gap: 10px;
}
.mwiz-btn {
  flex: 1; background: var(--surface); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; font: inherit; font-size: 14px; font-weight: 600;
  letter-spacing: .5px; cursor: pointer;
}
.mwiz-btn.primary {
  background: var(--cyber); color: var(--bg); border-color: var(--cyber);
  flex: 2; font-weight: 700;
}
.mwiz-btn:disabled { opacity: .35; }
.mwiz-btn.embark {
  flex: 1; background: var(--cyber); color: var(--bg); border-color: var(--cyber);
  text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
}

/* ============================================================
   ▒▒▒ DESKTOP HUB CSS ▒▒▒
   ============================================================ */
.hub {
  position: fixed; inset: 0;
  background: var(--bg); color: var(--text);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.hub-top {
  display: flex; align-items: center; gap: 20px;
  padding: 18px 32px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.hub-mark {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 13px;
  letter-spacing: 3px; text-transform: uppercase;
}
.hub-mark .dot {
  width: 8px; height: 8px; border-radius: 2px;
  background: var(--cyber); box-shadow: 0 0 0 1px #3fd0ff44;
}
.hub-nav { display: flex; gap: 2px; margin-left: 12px; }
.hub-nav button {
  padding: 6px 14px; border-radius: 6px;
  font-size: 13px; color: var(--muted); cursor: pointer;
  background: transparent; border: none;
}
.hub-nav button.on { color: var(--text); background: var(--surface-2); }
.hub-nav button:hover { color: var(--text); }
.hub-top-right {
  margin-left: auto; display: flex; align-items: center; gap: 14px;
  font-size: 12px; color: var(--muted);
}
.hub-sync {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px; border-radius: 100px;
  border: 1px solid var(--line);
  font-size: 11px; letter-spacing: 1px;
  font-family: 'JetBrains Mono', Consolas, monospace; color: var(--muted);
}
.hub-sync::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
}
.hub-sync.synced::before  { background: var(--good); box-shadow: 0 0 6px var(--good); }
.hub-sync.syncing::before { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: hub-sync-pulse 1s infinite; }
.hub-sync.offline::before { background: var(--bad);  box-shadow: 0 0 6px var(--bad); }
@keyframes hub-sync-pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.hub-email {
  color: var(--dim); font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px;
}
.hub-email a { color: var(--accent); margin-left: 8px; }
/* Theme toggle button — lives in the top bar */
.theme-btn {
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text); cursor: pointer; line-height: 1;
  padding: 5px 10px; border-radius: 100px; font: inherit; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .15s ease, background .15s ease;
}
.theme-btn:hover { border-color: var(--accent); }
.mhub-top .theme-btn { padding: 6px 9px; margin-left: 8px; font-size: 15px; }

.hub-head {
  display: grid; grid-template-columns: 1fr auto; gap: 32px;
  padding: 28px 32px 22px; border-bottom: 1px solid var(--line);
  align-items: end;
}
.hub-greet {

<script>
/* ============================================================
   Life Quest v3 — vanilla single-file app

   ============================================================ */

const STATE_KEY = 'lifeQuest_v1';

/* ----------------- Constants ----------------- */

const BUILT_IN_CLASSES = [

const CUSTOM_CLASS_PALETTE = [

/* Default quest list. Seeds state.quests on first run; users can edit. */

};

/* Extra quest templates the wizard offers (superset of defaults). */
const QUEST_TEMPLATES = {
  fit: [
    ...DEFAULT_QUESTS.fit,
    { id:'water_fit', label:'Workout: drink 32oz during',  xp:10 },
    { id:'mobility',  label:'Mobility / stretch (10 min)', xp:15 },

  ],

    ...DEFAULT_QUESTS.life,
    { id:'meditate', label:'10 min meditation', xp:10 },
