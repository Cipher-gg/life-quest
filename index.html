const ACHIEVEMENTS = [
  { id:'firstblood', ico:'🩸', title:'First Blood',       desc:'Complete your first day.' },
  { id:'iron7',      ico:'⛓️',  title:'Iron Habit',         desc:'7-day streak in any class.' },
  { id:'forged30',   ico:'🔥', title:'Forged',             desc:'30-day streak in any class.' },
  { id:'gym20',      ico:'💪', title:'Gym Rat',            desc:'Log 20 lift sessions.' },
  { id:'shipper',    ico:'📦', title:'Shipper',            desc:'Post 7 days in a row.' },
  { id:'pen50',      ico:'📚', title:'Knowledge is Power', desc:'25 hours of Sec+ study logged.' },
  { id:'labrat',     ico:'🧪', title:'Lab Rat',            desc:'Complete 10 hands-on labs.' },
  { id:'triathlete', ico:'🎯', title:'Triathlete',         desc:'5 days running where all 3 classes hit.' },
  { id:'diamond100', ico:'💎', title:'Diamond Hands',      desc:'100-day hero streak.' },
  { id:'bossdrop',   ico:'⚔️',  title:'Boss Slayer',        desc:'Defeat your first boss.' },
  { id:'creator1k',  ico:'📈', title:'1K Club',            desc:'Hit follower goal on any platform.' },
  { id:'secplus',    ico:'🛡️',  title:'Certified',          desc:'Pass Security+.' },
  { id:'tiktokstar', ico:'🎵', title:'TikTok Pull',        desc:'Hit your TikTok follower goal.' },
  { id:'instastar',  ico:'📷', title:'Insta Reach',        desc:'Hit your Instagram follower goal.' },
  { id:'youtube1k',  ico:'▶️',  title:'YouTube Era',        desc:'Hit your YouTube subs goal.' },
  { id:'tripleplat', ico:'👑', title:'Triple Threat',      desc:'Hit goals on TikTok, IG, AND YouTube.' },
  { id:'allnight',   ico:'🌙', title:'Renaissance Day',    desc:'Complete every single quest in one day.' },
];
/* ----------------- State ----------------- */

function defaultState() {
  const today = todayStr();
  const oneMonth = new Date(); oneMonth.setDate(oneMonth.getDate() + 30);
  return {
    version: 3,
    onboarded: false,            // v3 — gates first-run wizard
    name: 'Hero',
    today,
    xp: { fit: 0, content: 0, cyber: 0 },
    levels: { fit: 1, content: 1, cyber: 1 },
    streaks: { fit: 0, content: 0, cyber: 0, hero: 0 },
    lifetime: { lifts: 0, posts: 0, studyHours: 0, labs: 0, fullDays: 0, allCategoryDays: 0 },
    completions: {},
    weights: {},
    notes: {},
    quests: JSON.parse(JSON.stringify(DEFAULT_QUESTS)),
    achievements: {},
    settings: {
      secPlusDate: todayStr(oneMonth),
      tiktokNow: 0, tiktokGoal: 1000,
      instagramNow: 0, instagramGoal: 1000,
      youtubeNow: 0, youtubeGoal: 1000,
      postsGoal: 100,
    },
    bossDefeated: { secPlus: false, tiktok: false, instagram: false, youtube: false, posts: false },
    activeClasses: { fit: true, content: true, cyber: true },   // v3 — which classes equipped
    customClasses: [],          // v3 — [{id,name,icon,color,glow,tagline}]
    customBosses: [],           // v3 — [{id,classId,name,kind,current,goal,date}]
    theme: 'dark',              // v3 — 'dark' | 'light'
  };
}

let state = defaultState();

function mergeWithDefaults(s) {
  const def = defaultState();
  if (!s || typeof s !== 'object') return def;
  const merged = { ...def, ...s,
    xp:           {...def.xp, ...(s.xp || {})},
    levels:       {...def.levels, ...(s.levels || {})},
    streaks:      {...def.streaks, ...(s.streaks || {})},
    lifetime:     {...def.lifetime, ...(s.lifetime || {})},
    settings:     {...def.settings, ...(s.settings || {})},
    bossDefeated: {...def.bossDefeated, ...(s.bossDefeated || {})},
    completions:  s.completions  || {},
    weights:      s.weights      || {},
    notes:        s.notes        || {},
    quests:       (s.quests && Object.keys(s.quests).length) ? s.quests : def.quests,
    achievements: s.achievements || {},
    activeClasses: { ...def.activeClasses, ...(s.activeClasses || {}) },
    customClasses: Array.isArray(s.customClasses) ? s.customClasses : [],
    customBosses:  Array.isArray(s.customBosses)  ? s.customBosses  : [],
    theme:         (s.theme === 'light' || s.theme === 'dark') ? s.theme : def.theme,
  };

  // v1/v2 migration: existing users with any logged completion skip onboarding.
  if (typeof merged.onboarded !== 'boolean') merged.onboarded = false;
  const hasHistory = Object.values(merged.completions).some(d =>
    Object.values(d || {}).some(arr => Array.isArray(arr) && arr.length > 0));
  if (!merged.onboarded && hasHistory) merged.onboarded = true;

  return merged;
}

function setSyncStatus(status) {
  document.querySelectorAll('[data-sync]').forEach(el => {
    el.classList.remove('synced', 'syncing', 'offline');
    el.classList.add(status);
    const lbl = el.querySelector('[data-sync-label]');
    if (lbl) lbl.textContent = status === 'synced'  ? 'SYNCED'
                              : status === 'syncing' ? 'SYNCING'
                              : status === 'offline' ? 'OFFLINE'
                              : '…';
  });
}

function readLocalCache() {
  try { const raw = localStorage.getItem(STATE_KEY); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
}
function writeLocalCache() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch {}
}

async function loadFromApi() {
  try {
    const r = await fetch('/api/state', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();

    if (!s || Object.keys(s).length === 0) {
      const cached = readLocalCache();
      if (cached && Object.keys(cached).length > 0) {
        console.log('[migrate] seeding server state from localStorage cache');
        state = mergeWithDefaults(cached);
        await pushStateNow();
        return state;
      }
      return mergeWithDefaults({});
    }
    return mergeWithDefaults(s);
  } catch (e) {
    console.warn('[load] API unreachable, using localStorage cache:', e.message);
    setSyncStatus('offline');
    return mergeWithDefaults(readLocalCache());
  }
}

let saveDebounce = null;
let pendingPush = false;
function save() {
  writeLocalCache();
  setSyncStatus('syncing');
  pendingPush = true;
  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(pushStateNow, 500);
}
async function pushStateNow() {
  if (!pendingPush) return;
  pendingPush = false;
  try {
    const r = await fetch('/api/state', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSyncStatus('synced');
  } catch (e) {
    console.warn('[save] push failed:', e.message);
    setSyncStatus('offline');
    pendingPush = true;
  }
}
window.addEventListener('beforeunload', () => {
  if (pendingPush) {
    try { navigator.sendBeacon('/api/state', new Blob([JSON.stringify(state)], { type: 'application/json' })); } catch {}
  }
});

async function fetchSignedInEmail() {
  try {
    const r = await fetch('/api/me', { credentials: 'same-origin' });
    if (!r.ok) return null;
    const { email } = await r.json();
    return email || null;
  } catch { return null; }
}

let _signedInEmail = null;

function applyTheme() {
  const t = state.theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', t === 'light' ? '#f5f7fb' : '#0a0d14');
}
function setTheme(t) {
  state.theme = (t === 'light' ? 'light' : 'dark');
  applyTheme();
  save();
  render();
}
/* ----------------- Helpers ----------------- */

function todayStr(d=new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(a, b) {
  const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}
function capitalize(s) { return s[0].toUpperCase() + s.slice(1); }
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function initialsOf(name) {
  return (name || 'H').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || 'H';
}
function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }

/* All classes the user might display: built-ins + custom. Note: 'life' is
   handled separately because it's a buff pool, not a true class. */
function allCombatClasses() {
  return [...BUILT_IN_CLASSES, ...(state.customClasses || [])];
}
function getClassDef(id) {
  if (id === 'life') return LIFE_CLASS;
  return allCombatClasses().find(c => c.id === id);
}
function activeCombatClasses() {
  return allCombatClasses().filter(c => state.activeClasses[c.id] !== false);
}
/* Categories rendered in the daily-quests panel: active combat classes + life. */
function activeQuestCats() {
  return [...activeCombatClasses(), LIFE_CLASS];
}

/* ----------------- Date roll ----------------- */

function rollDateIfNeeded() {
  const t = todayStr();
  if (state.today === t) return;
  const yesterday = state.today;
  const yest = state.completions[yesterday] || {};
  Object.keys(state.xp).forEach(c => {
    const got = (yest[c] || []).length > 0;
    state.streaks[c] = got ? (state.streaks[c] || 0) + 1 : 0;
  });
  const anyDone = Object.keys(yest).some(c => (yest[c] || []).length > 0);
  state.streaks.hero = anyDone ? (state.streaks.hero || 0) + 1 : 0;
  state.today = t;
  save();
}

/* ----------------- XP / level math ----------------- */

function levelForXP(xp) { return Math.floor(xp / 100) + 1; }
function xpForLevel(lvl) { return (lvl - 1) * 100; }
function multiplierFor(streak) {
  if (streak >= 30) return 2.0;
  if (streak >= 14) return 1.5;
  if (streak >= 7)  return 1.25;
  return 1.0;
}
function awardXP(category, baseXP) {
  if (category === 'life') {
    const targets = activeCombatClasses().map(c => c.id);
    if (targets.length === 0) return;
    const split = Math.ceil(baseXP / targets.length);
    targets.forEach(c => addXPRaw(c, split));
  } else {
    addXPRaw(category, baseXP);
  }
}
function addXPRaw(cat, baseXP) {
  if (!(cat in state.xp)) state.xp[cat] = 0;
  if (!(cat in state.levels)) state.levels[cat] = 1;
  const mult = multiplierFor(state.streaks[cat] || 0);
  const gained = Math.round(baseXP * mult);
  const prevLvl = levelForXP(state.xp[cat]);
  state.xp[cat] += gained;
  const newLvl = levelForXP(state.xp[cat]);
  if (newLvl > prevLvl) {
    state.levels[cat] = newLvl;
    const def = getClassDef(cat);
    toast('LEVEL UP', `${def ? def.name : capitalize(cat)} → Lv ${newLvl}`);
  }
}

function toast(title, msg) {
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMsg').textContent = msg;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}
/* ----------------- Quest handling ----------------- */

/* selectedDate — the date the Today panel is currently showing. Defaults to
   state.today on init; changing it lets the user edit past days. Not
   persisted (it's a UI cursor, not user data). */
let selectedDate = null;
function getSelectedDate() {
  if (!selectedDate) selectedDate = state.today;
  if (selectedDate > state.today) selectedDate = state.today;   // never future
  return selectedDate;
}
function setSelectedDate(d) {
  if (!d) { selectedDate = state.today; return; }
  // Clamp: never future, never older than 365 days
  if (d > state.today) d = state.today;
  const minD = new Date(state.today + 'T00:00:00');
  minD.setDate(minD.getDate() - 365);
  const minStr = todayStr(minD);
  if (d < minStr) d = minStr;
  selectedDate = d;
}
function isViewingToday() { return getSelectedDate() === state.today; }

function isDone(cat, id) {
  const c = state.completions[getSelectedDate()] || {};
  return (c[cat] || []).includes(id);
}

function toggleQuest(cat, id) {
  rollDateIfNeeded();
  const date = getSelectedDate();
  const editingToday = (date === state.today);
  state.completions[date] = state.completions[date] || {};
  state.completions[date][cat] = state.completions[date][cat] || [];
  const arr = state.completions[date][cat];
  const idx = arr.indexOf(id);
  const def = (state.quests[cat] || []).find(q => q.id === id);
  if (!def) return;
  if (idx >= 0) {
    // UNTICK
    arr.splice(idx, 1);
    if (cat === 'life') {
      const targets = activeCombatClasses().map(c => c.id);
      if (targets.length) {
        const split = Math.ceil(def.xp / targets.length);
        targets.forEach(cc => { state.xp[cc] = Math.max(0, (state.xp[cc] || 0) - split); state.levels[cc] = levelForXP(state.xp[cc]); });
      }
    } else {
      state.xp[cat] = Math.max(0, (state.xp[cat] || 0) - def.xp);
      state.levels[cat] = levelForXP(state.xp[cat] || 0);
    }
  } else {
    // TICK
    arr.push(id);
    if (editingToday) {
      awardXP(cat, def.xp);
    } else {
      // Past day — base XP only (the streak multiplier at the time is unknown)
      if (cat === 'life') {
        const targets = activeCombatClasses().map(c => c.id);
        if (targets.length) {
          const split = Math.ceil(def.xp / targets.length);
          targets.forEach(cc => addXPRawBase(cc, split));
        }
      } else {
        addXPRawBase(cat, def.xp);
      }
    }
    // Lifetime counters: tick whether or not it's today (so retroactively
    // ticking a forgotten lift counts toward your total)
    if (cat === 'fit' && id === 'lift') state.lifetime.lifts++;
    if (cat === 'content' && id === 'post') state.lifetime.posts++;
    if (cat === 'cyber' && id === 'study') state.lifetime.studyHours++;
    if (cat === 'cyber' && id === 'lab') state.lifetime.labs++;
    const mult = (cat === 'life' || !editingToday) ? 1 : multiplierFor(state.streaks[cat] || 0);
    toast(editingToday ? '+XP' : '+XP (PAST)', `${def.label} — +${Math.round(def.xp * mult)} XP`);
  }
  checkAchievements();
  save();
  render();
}

/* Add XP at base value (no streak multiplier) — used for past-day edits. */
function addXPRawBase(cat, baseXP) {
  if (!(cat in state.xp)) state.xp[cat] = 0;
  if (!(cat in state.levels)) state.levels[cat] = 1;
  const prevLvl = levelForXP(state.xp[cat]);
  state.xp[cat] += baseXP;
  const newLvl = levelForXP(state.xp[cat]);
  if (newLvl > prevLvl) {
    state.levels[cat] = newLvl;
    const def = getClassDef(cat);
    toast('LEVEL UP', `${def ? def.name : capitalize(cat)} → Lv ${newLvl}`);
  }
}

function endDay() {
  rollDateIfNeeded();
  const c = state.completions[state.today] || {};
  const totalToday = Object.values(c).reduce((n, arr) => n + (arr || []).length, 0);
  if (totalToday === 0) {
    if (!confirm('No quests completed today. End day anyway? (Streaks will reset.)')) return;
  }
  const next = new Date(state.today + 'T00:00:00'); next.setDate(next.getDate() + 1);
  Object.keys(state.xp).forEach(cat => {
    const got = (c[cat] || []).length > 0;
    state.streaks[cat] = got ? (state.streaks[cat] || 0) + 1 : 0;
  });
  const anyDone = Object.keys(c).some(x => (c[x] || []).length > 0);
  state.streaks.hero = anyDone ? (state.streaks.hero || 0) + 1 : 0;
  const allCombat = activeCombatClasses().every(cls => (c[cls.id] || []).length > 0);
  if (allCombat && activeCombatClasses().length > 0) state.lifetime.allCategoryDays = (state.lifetime.allCategoryDays || 0) + 1;
  const allPossible = Object.keys(state.quests).every(cat => (c[cat] || []).length === (state.quests[cat] || []).length);
  if (allPossible) state.lifetime.fullDays = (state.lifetime.fullDays || 0) + 1;
  state.today = todayStr(next);
  toast('DAY LOCKED', 'Streaks updated. Rest, recover, repeat.');
  checkAchievements();
  save();
  render();
}

function resetToday() {
  const date = getSelectedDate();
  const label = date === state.today ? "today's" : `${date}'s`;
  if (!confirm(`Clear ${label} checks? XP gained for that day will be refunded.`)) return;
  const c = state.completions[date] || {};
  Object.entries(c).forEach(([cat, ids]) => {
    (ids || []).forEach(id => {
      const def = (state.quests[cat] || []).find(q => q.id === id);
      if (!def) return;
      if (cat === 'life') {
        const targets = activeCombatClasses().map(cl => cl.id);
        if (targets.length) {
          const split = Math.ceil(def.xp / targets.length);
          targets.forEach(cc => { state.xp[cc] = Math.max(0, (state.xp[cc] || 0) - split); state.levels[cc] = levelForXP(state.xp[cc]); });
        }
      } else {
        state.xp[cat] = Math.max(0, (state.xp[cat] || 0) - def.xp);
        state.levels[cat] = levelForXP(state.xp[cat]);
      }
    });
  });
  state.completions[date] = {};
  save();
  render();
}
/* ----------------- Achievements ----------------- */

function unlock(id) {
  if (state.achievements[id]) return;
  state.achievements[id] = { date: state.today };
  const def = ACHIEVEMENTS.find(a => a.id === id);
  if (def) toast('🏆 ACHIEVEMENT', `${def.title} — ${def.desc}`);
}

function checkAchievements() {
  const everCompleted = Object.values(state.completions).some(d =>
    Object.values(d || {}).some(arr => Array.isArray(arr) && arr.length > 0));
  if (everCompleted) unlock('firstblood');
  const maxStreak = Math.max(state.streaks.fit || 0, state.streaks.content || 0, state.streaks.cyber || 0);
  if (maxStreak >= 7) unlock('iron7');
  if (maxStreak >= 30) unlock('forged30');
  if (state.lifetime.lifts >= 20) unlock('gym20');
  if (consecutivePosts() >= 7) unlock('shipper');
  if (state.lifetime.studyHours >= 25) unlock('pen50');
  if (state.lifetime.labs >= 10) unlock('labrat');
  if (consecutiveAllThree() >= 5) unlock('triathlete');
  if ((state.streaks.hero || 0) >= 100) unlock('diamond100');
  if (Object.values(state.bossDefeated).some(x => x)) unlock('bossdrop');
  if (Object.keys(state.quests).every(cat => (state.completions[state.today]?.[cat] || []).length === (state.quests[cat] || []).length)) unlock('allnight');
  const tiktokHit = state.settings.tiktokNow >= state.settings.tiktokGoal;
  const instagramHit = state.settings.instagramNow >= state.settings.instagramGoal;
  const youtubeHit = state.settings.youtubeNow >= state.settings.youtubeGoal;
  if (tiktokHit)    { unlock('tiktokstar'); state.bossDefeated.tiktok = true; }
  if (instagramHit) { unlock('instastar');  state.bossDefeated.instagram = true; }
  if (youtubeHit)   { unlock('youtube1k');  state.bossDefeated.youtube = true; }
  if (tiktokHit || instagramHit || youtubeHit) unlock('creator1k');
  if (tiktokHit && instagramHit && youtubeHit) unlock('tripleplat');
  if (state.bossDefeated.secPlus) unlock('secplus');
}

function consecutivePosts() {
  let n = 0;
  let d = new Date(state.today + 'T00:00:00');
  for (let i = 0; i < 365; i++) {
    const k = todayStr(d);
    const arr = state.completions[k]?.content || [];
    if (arr.includes('post')) n++; else break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function consecutiveAllThree() {
  let n = 0;
  let d = new Date(state.today + 'T00:00:00');
  for (let i = 0; i < 365; i++) {
    const k = todayStr(d);
    const c = state.completions[k] || {};
    const ok = ['fit', 'content', 'cyber'].every(cat => (c[cat] || []).length > 0);
    if (ok) n++; else break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
/* ----------------- Boss list (built-in + custom, gated by activeClasses) ----------------- */

function bossList() {
  const list = [];
  // Built-ins
  if (state.activeClasses.cyber !== false) {
    const daysToExam = daysBetween(state.today, state.settings.secPlusDate);
    list.push({
      id: 'secPlus', classId: 'cyber',
      name: 'Security+ Exam', tag: 'FINAL BOSS', finalCls: true,
      hp: Math.max(0, Math.min(100, 100 - (state.lifetime.studyHours / 60) * 100)),
      hpLabel: `${state.lifetime.studyHours} / 60 study hrs`,
      meta: daysToExam >= 0 ? `<span class="countdown">${daysToExam}d</span> until exam` : `Exam was ${-daysToExam}d ago`,
      action: state.bossDefeated.secPlus ? 'Defeated ✓' : 'Mark exam passed',
      onAction: () => { state.bossDefeated.secPlus = true; checkAchievements(); save(); render(); },
    });
  }
  if (state.activeClasses.content !== false) {
    list.push({
      id: 'tiktok', classId: 'content', name: 'TikTok Followers', tag: 'SHORT-FORM',
      hp: Math.max(0, 100 - (state.settings.tiktokNow / state.settings.tiktokGoal) * 100),
      hpLabel: `${state.settings.tiktokNow.toLocaleString()} / ${state.settings.tiktokGoal.toLocaleString()}`,
      meta: 'Algorithm favors consistency',
    });
    list.push({
      id: 'instagram', classId: 'content', name: 'Instagram Followers', tag: 'SHORT-FORM',
      hp: Math.max(0, 100 - (state.settings.instagramNow / state.settings.instagramGoal) * 100),
      hpLabel: `${state.settings.instagramNow.toLocaleString()} / ${state.settings.instagramGoal.toLocaleString()}`,
      meta: 'Reels + carousels',
    });
    list.push({
      id: 'youtube', classId: 'content', name: 'YouTube Subscribers', tag: 'LONG-FORM',
      hp: Math.max(0, 100 - (state.settings.youtubeNow / state.settings.youtubeGoal) * 100),
      hpLabel: `${state.settings.youtubeNow.toLocaleString()} / ${state.settings.youtubeGoal.toLocaleString()} subs`,
      meta: 'Earn it after short-form traction',
    });
    list.push({
      id: 'posts', classId: 'content', name: 'Ship 100 Posts', tag: 'GRIND BOSS',
      hp: Math.max(0, 100 - (state.lifetime.posts / state.settings.postsGoal) * 100),
      hpLabel: `${state.lifetime.posts} / ${state.settings.postsGoal} posts`,
      meta: 'Consistency unlocks the algo',
    });
  }
  // Custom — gated by parent class equipped
  (state.customBosses || []).forEach(b => {
    if (state.activeClasses[b.classId] === false) return;
    if (b.kind === 'count') {
      const goal = Math.max(1, b.goal || 1);
      const cur = b.current || 0;
      list.push({
        id: b.id, classId: b.classId, name: b.name, tag: 'CUSTOM',
        hp: Math.max(0, 100 - (cur / goal) * 100),
        hpLabel: `${cur.toLocaleString()} / ${goal.toLocaleString()}`,
        meta: 'Custom · update from Settings',
        custom: true,
      });
    } else if (b.kind === 'date') {
      const days = daysBetween(state.today, b.date);
      list.push({
        id: b.id, classId: b.classId, name: b.name, tag: 'CUSTOM · DATE',
        hp: Math.max(0, days < 0 ? 0 : 50),   // visual approximation; no progress meter for dates
        hpLabel: days >= 0 ? `${days}d remaining` : `${-days}d past target`,
        meta: b.date,
        custom: true,
      });
    }
  });
  return list;
}
/* ============================================================
   Wizard onboarding
   ------------------------------------------------------------
   Single state machine, two layouts (desktop / mobile). Each
   step's renderer returns an HTML string; event handlers re-render
   the whole wizard on every interaction (cheap — DOM is small).
   ============================================================ */

const WIZ_STEPS = ['Identity', 'Classes', 'Bosses', 'Quests', 'Embark'];

const wiz = {
  step: 0,
  name: '',
  tagline: '',
  classes: { fit: true, content: true, cyber: true },
  customClasses: [],          // [{id,name,icon,color,glow,tagline}]
  customBosses: {},           // { classId: [{id,name,kind,goal,current,date}] }
  bosses: {
    secPlusDate: wzDate(45),
    tiktokNow: 0, tiktokGoal: 1000,
    instagramNow: 0, instagramGoal: 1000,
    youtubeNow: 0, youtubeGoal: 1000,
    postsGoal: 100,
  },
  enabled: (() => {
    const e = {};
    Object.entries(QUEST_TEMPLATES).forEach(([cat, list]) => {
      e[cat] = new Set(list.slice(0, 4).map(q => q.id));
    });
    return e;
  })(),
  customQuests: { fit: [], content: [], cyber: [], life: [] },
  // Transient UI state — not persisted
  showAddClass: false,
  addingBossFor: null,   // classId currently showing add-boss form
  newQuestText: {},      // { catId: text }
};

function wzDate(daysFromNow) {
  const d = new Date(); d.setDate(d.getDate() + daysFromNow);
  return d.toISOString().slice(0, 10);
}

function wizAllCats() {
  const cats = [];
  BUILT_IN_CLASSES.forEach(c => { if (wiz.classes[c.id]) cats.push({ ...c, gated: false }); });
  cats.push({ ...LIFE_CLASS, gated: false });
  wiz.customClasses.forEach(c => { if (wiz.classes[c.id]) cats.push({ ...c, custom: true, gated: false }); });
  return cats;
}

function wizCanNext() {
  if (wiz.step === 0) return wiz.name.trim().length > 0;
  if (wiz.step === 1) return Object.values(wiz.classes).some(Boolean);
  return true;
}

function wizGo(n) { wiz.step = Math.max(0, Math.min(WIZ_STEPS.length - 1, n)); renderWizard(); }
function wizToggleClass(id) { wiz.classes[id] = !wiz.classes[id]; renderWizard(); }
function wizToggleQuest(cat, id) {
  const s = new Set(wiz.enabled[cat] || []);
  if (s.has(id)) s.delete(id); else s.add(id);
  wiz.enabled[cat] = s;
  renderWizard();
}
function wizAddCustomClass(name, icon, paletteId) {
  const p = CUSTOM_CLASS_PALETTE.find(x => x.id === paletteId) || CUSTOM_CLASS_PALETTE[0];
  const id = uid('cls');
  wiz.customClasses.push({ id, name: name.trim(), icon, color: p.color, glow: p.glow, tagline: 'Custom · your grind', blurb: 'Quests you add for this class show up on the hub like the built-ins.', custom: true });
  wiz.classes[id] = true;
  wiz.enabled[id] = new Set();
  wiz.customQuests[id] = [];
  wiz.newQuestText[id] = '';
  wiz.showAddClass = false;
  renderWizard();
}
function wizRemoveCustomClass(id) {
  wiz.customClasses = wiz.customClasses.filter(c => c.id !== id);
  delete wiz.classes[id];
  delete wiz.enabled[id];
  delete wiz.customQuests[id];
  delete wiz.customBosses[id];
  delete wiz.newQuestText[id];
  renderWizard();
}
function wizAddCustomBoss(classId, def) {
  const id = uid('b');
  wiz.customBosses[classId] = [...(wiz.customBosses[classId] || []), { id, ...def }];
  wiz.addingBossFor = null;
  renderWizard();
}
function wizRemoveCustomBoss(classId, bossId) {
  wiz.customBosses[classId] = (wiz.customBosses[classId] || []).filter(b => b.id !== bossId);
  renderWizard();
}
function wizAddCustomQuest(cat) {
  const t = (wiz.newQuestText[cat] || '').trim();
  if (!t) return;
  const id = uid('q');
  wiz.customQuests[cat] = [...(wiz.customQuests[cat] || []), { id, label: t, xp: 20 }];
  if (!wiz.enabled[cat]) wiz.enabled[cat] = new Set();
  wiz.enabled[cat].add(id);
  wiz.newQuestText[cat] = '';
  renderWizard();
}
function wizSetBoss(k, v) { wiz.bosses[k] = v; renderWizard(); }

/* ----- Commit: write wizard state to app state, then exit to hub ----- */
function wizEmbark() {
  rollDateIfNeeded();
  state.onboarded = true;
  state.name = wiz.name.trim() || 'Hero';

  // Active classes — built-in + custom merged into a single map
  state.activeClasses = {};
  BUILT_IN_CLASSES.forEach(c => { state.activeClasses[c.id] = !!wiz.classes[c.id]; });
  wiz.customClasses.forEach(c => { state.activeClasses[c.id] = !!wiz.classes[c.id]; });
  state.customClasses = wiz.customClasses.map(c => ({
    id: c.id, name: c.name, icon: c.icon, color: c.color, glow: c.glow,
    tagline: c.tagline || 'Custom · your grind',
  }));

  // Quests: union of enabled templates + custom quests, keyed by category
  state.quests = {};
  Object.keys(QUEST_TEMPLATES).forEach(cat => {
    const en = wiz.enabled[cat] || new Set();
    const built = QUEST_TEMPLATES[cat].filter(q => en.has(q.id));
    const custom = (wiz.customQuests[cat] || []).filter(q => en.has(q.id));
    state.quests[cat] = [...built, ...custom];
  });
  wiz.customClasses.forEach(cc => {
    const en = wiz.enabled[cc.id] || new Set();
    const custom = (wiz.customQuests[cc.id] || []).filter(q => en.has(q.id));
    state.quests[cc.id] = custom;
    if (!(cc.id in state.xp))     state.xp[cc.id] = 0;
    if (!(cc.id in state.levels)) state.levels[cc.id] = 1;
    if (!(cc.id in state.streaks))state.streaks[cc.id] = 0;
  });
  // Drop XP/levels for classes that are unequipped, to keep state lean
  Object.keys(state.xp).forEach(k => {
    if (state.activeClasses[k] === false && !['fit','content','cyber'].includes(k)) delete state.xp[k];
  });

  // Bosses settings
  state.settings.secPlusDate    = wiz.bosses.secPlusDate || state.settings.secPlusDate;
  state.settings.tiktokNow      = +wiz.bosses.tiktokNow      || 0;
  state.settings.tiktokGoal     = +wiz.bosses.tiktokGoal     || 1000;
  state.settings.instagramNow   = +wiz.bosses.instagramNow   || 0;
  state.settings.instagramGoal  = +wiz.bosses.instagramGoal  || 1000;
  state.settings.youtubeNow     = +wiz.bosses.youtubeNow     || 0;
  state.settings.youtubeGoal    = +wiz.bosses.youtubeGoal    || 1000;
  state.settings.postsGoal      = +wiz.bosses.postsGoal      || 100;

  // Custom bosses flatten
  const cb = [];
  Object.entries(wiz.customBosses).forEach(([classId, arr]) => {
    (arr || []).forEach(b => cb.push({ id: b.id, classId, name: b.name, kind: b.kind, goal: +b.goal || 0, current: +b.current || 0, date: b.date || null }));
  });
  state.customBosses = cb;

  save();
  document.getElementById('wizardRoot').hidden = true;
  document.getElementById('wizardRoot').innerHTML = '';
  enterHub();
}

/* ----- Renderer ----- */
function renderWizard() {
  const root = document.getElementById('wizardRoot');
  root.hidden = false;
  document.getElementById('hubRoot').hidden = true;
  document.getElementById('mhubRoot').hidden = true;
  const mobile = isMobile();
  root.innerHTML = mobile ? renderMobileWizard() : renderDesktopWizard();
  attachWizardHandlers(mobile);
}

function attachWizardHandlers(mobile) {
  // Generic delegated click handler driven by data-w attributes
  const root = document.getElementById('wizardRoot');
  root.querySelectorAll('[data-w]').forEach(el => {
    const action = el.dataset.w;
    el.addEventListener('click', (e) => handleWizClick(e, action, el));
  });
  // Input handlers
  root.querySelectorAll('[data-w-input]').forEach(el => {
    const key = el.dataset.wInput;
    el.addEventListener('input', () => {
      handleWizInput(key, el.value, el);
    });
  });
  // Keydown (Enter) for inline forms
  root.querySelectorAll('[data-w-enter]').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      handleWizClick(e, el.dataset.wEnter, el);
    });
  });
  // Autofocus the first input on each step
  const af = root.querySelector('[data-autofocus]');
  if (af) try { af.focus(); } catch {}
}

function handleWizInput(key, value, el) {
  const parts = key.split('.');
  if (parts[0] === 'name')     { wiz.name = value; updateAvatar(); return; }
  if (parts[0] === 'tagline')  { wiz.tagline = value; return; }
  if (parts[0] === 'boss')     { wiz.bosses[parts[1]] = (el.type === 'number' ? +value || 0 : value); /* no rerender — would steal focus */ return; }
  if (parts[0] === 'addclass') {
    wiz._addClass = wiz._addClass || { name: '', icon: CUSTOM_CLASS_ICONS[0], paletteId: CUSTOM_CLASS_PALETTE[0].id };
    wiz._addClass[parts[1]] = value;
    return;
  }
  if (parts[0] === 'newquest') { wiz.newQuestText[parts[1]] = value; return; }
  if (parts[0] === 'addboss')  {
    wiz._addBoss = wiz._addBoss || { classId: parts[1], name: '', kind: 'count', goal: 100, current: 0, date: wzDate(30) };
    wiz._addBoss[parts[2]] = (parts[2] === 'goal' || parts[2] === 'current') ? +value || 0 : value;
    return;
  }
}

function updateAvatar() {
  // Live-update the avatar without re-rendering the whole wizard.
  const av = document.getElementById('wzAvatar');
  if (av) av.textContent = initialsOf(wiz.name);
  const valid = wizCanNext();
  const next = document.querySelector('[data-w="next"]');
  if (next) next.disabled = !valid;
}

function handleWizClick(e, action, el) {
  e.preventDefault?.();
  if (action === 'next') { wizGo(wiz.step + 1); return; }
  if (action === 'back') { wizGo(wiz.step - 1); return; }
  if (action === 'embark') { wizEmbark(); return; }

  if (action === 'toggle-class') { wizToggleClass(el.dataset.id); return; }
  if (action === 'remove-class') { e.stopPropagation(); wizRemoveCustomClass(el.dataset.id); return; }
  if (action === 'show-add-class') { wiz.showAddClass = true; wiz._addClass = { name: '', icon: CUSTOM_CLASS_ICONS[0], paletteId: CUSTOM_CLASS_PALETTE[0].id }; renderWizard(); return; }
  if (action === 'cancel-add-class') { wiz.showAddClass = false; renderWizard(); return; }
  if (action === 'pick-icon') { wiz._addClass = wiz._addClass || {}; wiz._addClass.icon = el.dataset.icon; renderWizard(); return; }
  if (action === 'pick-palette') { wiz._addClass = wiz._addClass || {}; wiz._addClass.paletteId = el.dataset.id; renderWizard(); return; }
  if (action === 'save-add-class') {
    const a = wiz._addClass || {};
    if (!a.name || !a.name.trim()) return;
    wizAddCustomClass(a.name, a.icon || CUSTOM_CLASS_ICONS[0], a.paletteId || CUSTOM_CLASS_PALETTE[0].id);
    return;
  }

  if (action === 'show-add-boss')   { wiz.addingBossFor = el.dataset.classId; wiz._addBoss = { classId: wiz.addingBossFor, name: '', kind: 'count', goal: 100, current: 0, date: wzDate(30) }; renderWizard(); return; }
  if (action === 'cancel-add-boss') { wiz.addingBossFor = null; renderWizard(); return; }
  if (action === 'pick-boss-kind')  { wiz._addBoss = wiz._addBoss || {}; wiz._addBoss.kind = el.dataset.kind; renderWizard(); return; }
  if (action === 'save-add-boss')   {
    const b = wiz._addBoss || {};
    if (!b.name || !b.name.trim()) return;
    if (b.kind === 'count' && !(b.goal > 0)) return;
    if (b.kind === 'date'  && !b.date) return;
    wizAddCustomBoss(b.classId, { name: b.name.trim(), kind: b.kind, goal: b.goal, current: b.current || 0, date: b.date || null });
    return;
  }
  if (action === 'remove-boss') { wizRemoveCustomBoss(el.dataset.classId, el.dataset.id); return; }

  if (action === 'toggle-quest')   { wizToggleQuest(el.dataset.cat, el.dataset.id); return; }
  if (action === 'add-quest')      { wizAddCustomQuest(el.dataset.cat); return; }
}

/* -------- Desktop wizard renderer -------- */
function renderDesktopWizard() {
  const stepHtml =
    wiz.step === 0 ? wzStepIdentity() :
    wiz.step === 1 ? wzStepClasses() :
    wiz.step === 2 ? wzStepBosses() :
    wiz.step === 3 ? wzStepQuests() :
                     wzStepEmbark();
  const stepsBar = WIZ_STEPS.map((label, i) => `
    <div class="wz-step ${i < wiz.step ? 'done' : ''} ${i === wiz.step ? 'active' : ''}">
      <span class="n">${i < wiz.step ? '✓' : i + 1}</span>
      <span>${label}</span>
    </div>`).join('');
  const isLast = wiz.step === WIZ_STEPS.length - 1;
  return `
    <div class="wz-scope">
      <div class="wz">
        <div class="wz-top">
          <div class="wz-mark"></div>
          <div>
            <div class="wz-mark-title">Life Quest</div>
            <div class="wz-mark-sub">Hero Creation · v3</div>
          </div>
          <div class="wz-steps">${stepsBar}</div>
        </div>
        <div class="wz-body">${stepHtml}</div>
        <div class="wz-foot">
          <button class="lq-btn ghost" data-w="back" ${wiz.step === 0 ? 'disabled' : ''}>← Back</button>
          <div class="wz-progress">
            <div class="lbl">Step ${wiz.step + 1} of ${WIZ_STEPS.length}</div>
            <div class="wz-pbar"><div style="width:${((wiz.step + 1) / WIZ_STEPS.length * 100)}%"></div></div>
          </div>
          <div class="spacer"></div>
          ${isLast
            ? `<button class="lq-btn primary" data-w="embark">Begin Quest →</button>`
            : `<button class="lq-btn primary" data-w="next" ${wizCanNext() ? '' : 'disabled'}>Continue →</button>`}
        </div>
      </div>
    </div>`;
}

function wzStepIdentity() {
  return `
    <div class="wz-stepnum">Step 01</div>
    <h1 class="wz-h1">Name your <span class="accent">hero</span>.</h1>
    <div class="wz-lede">This is the name above your avatar on the daily hub. You can change it anytime.</div>
    <div class="wz-identity">
      <div>
        <div class="wz-avatar" id="wzAvatar">${initialsOf(wiz.name)}</div>
        <div class="wz-avatar-cap">your sigil</div>
      </div>
      <div>
        <div class="wz-field">
          <label class="lq-lbl">Hero name</label>
          <input type="text" data-w-input="name" data-autofocus value="${escapeHtml(wiz.name)}" placeholder="Mason, Cipher, Wraith…" />
        </div>
        <div class="wz-field">
          <label class="lq-lbl">Callsign · optional</label>
          <input type="text" data-w-input="tagline" value="${escapeHtml(wiz.tagline)}" placeholder="The cert grind, the gym, the trenches." />
        </div>
        <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;">
          <span class="lq-pill mono">Synced via /api</span>
          <span class="lq-pill mono">SSO via CF Access</span>
        </div>
      </div>
    </div>`;
}

function wzStepClasses() {
  const all = [...BUILT_IN_CLASSES, ...wiz.customClasses];
  const count = Object.values(wiz.classes).filter(Boolean).length;
  const cards = all.map(c => {
    const on = !!wiz.classes[c.id];
    const removeBtn = c.custom ? `<button class="x-remove" data-w="remove-class" data-id="${c.id}" title="Remove">×</button>` : '';
    const icon = c.custom ? `<div class="ic-custom">${c.icon}</div>` : `<div class="ic">${c.icon}</div>`;
    return `
      <div class="wz-class ${on ? 'on' : ''}" style="--c:${c.color};--cg:${c.glow}" data-w="toggle-class" data-id="${c.id}">
        ${removeBtn}
        ${icon}
        <h3>${escapeHtml(c.name)}</h3>
        <div class="tag">${escapeHtml(c.tagline || '')}</div>
        <div class="blurb">${escapeHtml(c.blurb || 'Custom class — add quests on the next step.')}</div>
        <div class="toggle">
          <span class="check"></span>
          <span>${on ? 'Equipped' : 'Tap to equip'}</span>
        </div>
      </div>`;
  }).join('');
  let addTile;
  if (wiz.showAddClass) {
    const a = wiz._addClass || { name: '', icon: CUSTOM_CLASS_ICONS[0], paletteId: CUSTOM_CLASS_PALETTE[0].id };
    const palette = CUSTOM_CLASS_PALETTE.find(p => p.id === a.paletteId) || CUSTOM_CLASS_PALETTE[0];
    const icons = CUSTOM_CLASS_ICONS.map(i => `<button class="${a.icon === i ? 'on' : ''}" data-w="pick-icon" data-icon="${i}">${i}</button>`).join('');
    const swatches = CUSTOM_CLASS_PALETTE.map(p => `<button class="${a.paletteId === p.id ? 'on' : ''}" style="--c:${p.color}" data-w="pick-palette" data-id="${p.id}" title="${p.label}"></button>`).join('');
    addTile = `
      <div class="wz-addclass-form">
        <div class="ttl">New class</div>
        <div><label class="lq-lbl">Name</label>
          <input type="text" data-w-input="addclass.name" data-w-enter="save-add-class" data-autofocus value="${escapeHtml(a.name || '')}" placeholder="School, Music, Work…" /></div>
        <div><label class="lq-lbl">Icon</label><div class="wz-icons">${icons}</div></div>
        <div><label class="lq-lbl">Color</label><div class="wz-swatches">${swatches}</div></div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0 4px;border-top:1px dashed var(--line);">
          <span style="font-size:22px">${a.icon}</span>
          <div style="flex:1;font-size:13px;color:var(--muted);">
            <strong style="color:${palette.color}">${escapeHtml(a.name || 'Class name')}</strong>
          </div>
        </div>
        <div class="wz-form-row">
          <button class="lq-btn ghost" data-w="cancel-add-class">Cancel</button>
          <button class="lq-btn primary" data-w="save-add-class" ${(a.name || '').trim() ? '' : 'disabled'}>Add class</button>
        </div>
      </div>`;
  } else {
    addTile = `
      <button class="wz-addclass-tile" data-w="show-add-class">
        <span class="plus">+</span>
        <h4>Add your own</h4>
        <p>School, music, work, anything you want to grind on.</p>
      </button>`;
  }
  return `
    <div class="wz-stepnum">Step 02</div>
    <h1 class="wz-h1">Choose your <span class="accent">classes</span>.</h1>
    <div class="wz-lede">Each class is its own XP pool, level, and streak. Pick the built-in three or add your own.</div>
    <div class="wz-classes">${cards}${addTile}</div>
    <div class="mono" style="margin-top:18px;color:var(--dim);font-size:12px;letter-spacing:1px;">
      ${count} class${count === 1 ? '' : 'es'} equipped${count === 0 ? ' · pick at least one to continue' : ''}
    </div>`;
}

function wzStepBosses() {
  const builtIn = {
    cyber: [{ id: 'secPlus', icon: '🛡️', name: 'Security+ Exam', desc: 'Final boss for the cyber track. Pick a target date.', kind: 'date' }],
    content: [
      { id: 'tiktok', icon: '🎵', name: 'TikTok Followers', desc: 'Short-form pull. Set your goal.', kind: 'count', nowK: 'tiktokNow', goalK: 'tiktokGoal' },
      { id: 'ig',     icon: '📷', name: 'Instagram Followers', desc: 'Reels and carousels.', kind: 'count', nowK: 'instagramNow', goalK: 'instagramGoal' },
      { id: 'yt',     icon: '▶️', name: 'YouTube Subscribers', desc: 'Long-form. Earn it after short-form traction.', kind: 'count', nowK: 'youtubeNow', goalK: 'youtubeGoal' },
      { id: 'posts',  icon: '📦', name: 'Ship 100 Posts', desc: 'Grind boss. How many total posts?', kind: 'goalOnly', goalK: 'postsGoal' },
    ],
  };
  const groups = [
    { id: 'fit',     name: 'Fitness', icon: '🏋️', color: '#ff5d7a', equipped: !!wiz.classes.fit,     builtIns: [] },
    { id: 'content', name: 'Content', icon: '🎬', color: '#b96bff', equipped: !!wiz.classes.content, builtIns: builtIn.content },
    { id: 'cyber',   name: 'Cyber',   icon: '🛡️', color: '#3fd0ff', equipped: !!wiz.classes.cyber,   builtIns: builtIn.cyber },
    ...wiz.customClasses.map(cc => ({ id: cc.id, name: cc.name, icon: cc.icon, color: cc.color, equipped: !!wiz.classes[cc.id], builtIns: [] })),
  ].filter(g => g.equipped);

  if (groups.length === 0) {
    return `<div class="wz-stepnum">Step 03</div><h1 class="wz-h1">No classes equipped.</h1>
            <div class="wz-lede">Go back and equip at least one class to set bosses.</div>`;
  }

  const groupsHtml = groups.map(g => {
    const builtCards = g.builtIns.map(b => wzBuiltInBossCard(b, g.color)).join('');
    const customCards = (wiz.customBosses[g.id] || []).map(b => wzCustomBossCard(b, g.id, g.color)).join('');
    let addSlot;
    if (wiz.addingBossFor === g.id) {
      const b = wiz._addBoss || { kind: 'count', goal: 100, current: 0, date: wzDate(30) };
      const countFields = `
        <div class="row">
          <div><label class="lq-lbl">Now</label><input type="number" min="0" data-w-input="addboss.${g.id}.current" value="${b.current || 0}" /></div>
          <div><label class="lq-lbl">Goal</label><input type="number" min="1" data-w-input="addboss.${g.id}.goal" value="${b.goal || 1}" /></div>
        </div>`;
      const dateField = `<div><label class="lq-lbl">Target date</label><input type="date" data-w-input="addboss.${g.id}.date" value="${b.date}" /></div>`;
      addSlot = `
        <div class="wz-addboss-form" style="--c:${g.color}">
          <div class="ttl">New boss</div>
          <div><label class="lq-lbl">Boss name</label>
            <input type="text" data-w-input="addboss.${g.id}.name" data-w-enter="save-add-boss" data-autofocus value="${escapeHtml(b.name || '')}" placeholder="Run a 5K, Read 12 books, Hit $5k MRR…" /></div>
          <div><label class="lq-lbl">Goal type</label>
            <div class="kind-toggle">
              <button class="${b.kind === 'count' ? 'on' : ''}" data-w="pick-boss-kind" data-kind="count">Number goal</button>
              <button class="${b.kind === 'date'  ? 'on' : ''}" data-w="pick-boss-kind" data-kind="date">Date target</button>
            </div>
          </div>
          ${b.kind === 'count' ? countFields : dateField}
          <div class="actions">
            <button class="lq-btn ghost" data-w="cancel-add-boss">Cancel</button>
            <button class="lq-btn primary" data-w="save-add-boss" ${(b.name || '').trim() ? '' : 'disabled'}>Add boss</button>
          </div>
        </div>`;
    } else {
      addSlot = `<button class="wz-addboss-btn" style="--c:${g.color}" data-w="show-add-boss" data-class-id="${g.id}">+ Add boss for this class</button>`;
    }
    return `
      <div class="wz-boss-class-group" style="--c:${g.color}">
        <div class="wz-boss-class-h"><span class="name"><span style="margin-right:6px">${g.icon}</span>${escapeHtml(g.name)}</span></div>
        ${builtCards}${customCards}${addSlot}
      </div>`;
  }).join('');

  return `
    <div class="wz-stepnum">Step 03</div>
    <h1 class="wz-h1">Set your <span class="accent">bosses</span>.</h1>
    <div class="wz-lede">Big milestones with HP bars on the hub. Set targets for built-ins, or add your own for any class.</div>
    <div class="wz-bosses">${groupsHtml}</div>`;
}

function wzBuiltInBossCard(b, color) {
  const fields =
    b.kind === 'date' ?
      `<input type="date" data-w-input="boss.secPlusDate" value="${wiz.bosses.secPlusDate}" />` :
    b.kind === 'count' ?
      `<div class="pair">
         <div><label class="lq-lbl">Now</label><input type="number" min="0" data-w-input="boss.${b.nowK}" value="${wiz.bosses[b.nowK]}" /></div>
         <div><label class="lq-lbl">Goal</label><input type="number" min="1" data-w-input="boss.${b.goalK}" value="${wiz.bosses[b.goalK]}" /></div>
       </div>` :
      `<div><label class="lq-lbl">Target</label><input type="number" min="1" data-w-input="boss.${b.goalK}" value="${wiz.bosses[b.goalK]}" /></div>`;
  return `
    <div class="wz-boss" style="--c:${color};border-color:${color}">
      <div>
        <div class="head"><span class="icon">${b.icon}</span><span class="name">${escapeHtml(b.name)}</span></div>
        <div class="desc">${escapeHtml(b.desc)}</div>
      </div>
      <div class="field">${fields}</div>
    </div>`;
}

function wzCustomBossCard(b, classId, color) {
  const desc = b.kind === 'date' ? `Target date: ${b.date}` : `Goal: ${b.current || 0} / ${b.goal}`;
  return `
    <div class="wz-boss" style="--c:${color};border-color:${color}">
      <button class="x-remove-boss" data-w="remove-boss" data-class-id="${classId}" data-id="${b.id}">×</button>
      <div>
        <div class="head">
          <span class="icon">🎯</span>
          <span class="name">${escapeHtml(b.name)}</span>
          <span class="lq-pill" style="color:${color};border-color:${color};margin-left:6px;">custom</span>
        </div>
        <div class="desc">${escapeHtml(desc)}</div>
      </div>
      <div class="field"></div>
    </div>`;
}

function wzStepQuests() {
  const cats = wizAllCats();
  const cols = cats.map(c => {
    const tmpl = QUEST_TEMPLATES[c.id] || [];
    const custom = wiz.customQuests[c.id] || [];
    const en = wiz.enabled[c.id] || new Set();
    const totalXP = [...tmpl, ...custom].filter(q => en.has(q.id)).reduce((n, q) => n + q.xp, 0);
    const list = [...tmpl, ...custom].map(q => {
      const on = en.has(q.id);
      return `
        <div class="wz-quest ${on ? 'on' : 'off'}" data-w="toggle-quest" data-cat="${c.id}" data-id="${q.id}">
          <span class="chk"></span>
          <span class="lbl">${escapeHtml(q.label)}</span>
          <span class="xp">+${q.xp}</span>
        </div>`;
    }).join('');
    const emptyNote = (tmpl.length === 0 && custom.length === 0) ? '<div class="sum" style="font-style:italic;color:var(--dim)">No defaults — add yours below.</div>' : '';
    return `
      <div class="wz-qcol" style="--c:${c.color};--cg:${c.glow}">
        <h4><span style="font-size:16px">${c.icon}</span> ${escapeHtml(c.name)}</h4>
        <div class="sum">${en.size} active · ${totalXP} XP / day max</div>
        ${emptyNote}
        <div style="flex:1;overflow-y:auto;min-height:0">${list}</div>
        <div class="add">
          <input type="text" data-w-input="newquest.${c.id}" data-w-enter="add-quest" data-cat="${c.id}" value="${escapeHtml(wiz.newQuestText[c.id] || '')}" placeholder="Add custom quest…" />
          <button data-w="add-quest" data-cat="${c.id}">+ Add</button>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="wz-stepnum">Step 04</div>
    <h1 class="wz-h1">Forge your <span class="accent">daily quests</span>.</h1>
    <div class="wz-lede" style="margin-bottom:18px;">Toggle a quest off if it doesn't fit. Add your own. You can edit again from Settings.</div>
    <div class="wz-quest-grid">${cols}</div>`;
}

function wzStepEmbark() {
  const active = [...BUILT_IN_CLASSES, ...wiz.customClasses].filter(c => wiz.classes[c.id]);
  const daysToExam = Math.max(0, daysBetween(todayStr(), wiz.bosses.secPlusDate));
  const totalEnabledQuests = wizAllCats().reduce((n, c) => n + ((wiz.enabled[c.id]?.size) || 0), 0);
  const totalDailyXP = wizAllCats().reduce((n, cat) => {
    const tmpl = QUEST_TEMPLATES[cat.id] || [];
    const cust = wiz.customQuests[cat.id] || [];
    const en = wiz.enabled[cat.id] || new Set();
    return n + [...tmpl, ...cust].filter(q => en.has(q.id)).reduce((s, q) => s + q.xp, 0);
  }, 0);
  const pills = active.length === 0
    ? `<span style="color:var(--dim);font-size:13px">None — go back and pick at least one.</span>`
    : active.map(c => `<span class="lq-pill" style="color:${c.color};border-color:${c.color}"><span>${c.icon}</span><span>${escapeHtml(c.name)}</span></span>`).join('');
  const bossRows = [];
  if (wiz.classes.cyber) bossRows.push(`<div class="wz-recap-row"><div><div style="font-weight:700">🛡️ Security+ Exam</div><div style="color:var(--muted);font-size:11px;margin-top:2px">${wiz.bosses.secPlusDate}</div></div><div class="mono" style="color:var(--warn);font-weight:800">${daysToExam}d</div></div>`);
  if (wiz.classes.content) {
    bossRows.push(`<div class="wz-recap-row"><div><div style="font-weight:700">🎵 TikTok</div></div><div class="mono" style="color:var(--content)">${(+wiz.bosses.tiktokNow||0).toLocaleString()} / ${(+wiz.bosses.tiktokGoal||0).toLocaleString()}</div></div>`);
    bossRows.push(`<div class="wz-recap-row"><div><div style="font-weight:700">📷 Instagram</div></div><div class="mono" style="color:var(--content)">${(+wiz.bosses.instagramNow||0).toLocaleString()} / ${(+wiz.bosses.instagramGoal||0).toLocaleString()}</div></div>`);
    bossRows.push(`<div class="wz-recap-row"><div><div style="font-weight:700">▶️ YouTube</div></div><div class="mono" style="color:var(--content)">${(+wiz.bosses.youtubeNow||0).toLocaleString()} / ${(+wiz.bosses.youtubeGoal||0).toLocaleString()}</div></div>`);
    bossRows.push(`<div class="wz-recap-row"><div><div style="font-weight:700">📦 Ship 100 Posts</div></div><div class="mono" style="color:var(--content)">0 / ${(+wiz.bosses.postsGoal||100).toLocaleString()}</div></div>`);
  }
  Object.entries(wiz.customBosses).forEach(([classId, arr]) => {
    if (!wiz.classes[classId]) return;
    const cls = [...BUILT_IN_CLASSES, ...wiz.customClasses].find(c => c.id === classId);
    (arr || []).forEach(b => {
      const right = b.kind === 'date' ? `${b.date}` : `${(b.current||0).toLocaleString()} / ${(b.goal||0).toLocaleString()}`;
      bossRows.push(`<div class="wz-recap-row"><div><div style="font-weight:700">🎯 ${escapeHtml(b.name)} <span style="color:var(--dim);font-size:11px">· ${escapeHtml(cls?.name || classId)}</span></div></div><div class="mono" style="color:${cls?.color || 'var(--cyber)'}">${right}</div></div>`);
    });
  });

  return `
    <div class="wz-stepnum">Step 05</div>
    <h1 class="wz-h1">Ready, <span class="accent">${escapeHtml(wiz.name || 'hero')}</span>?</h1>
    <div class="wz-lede" style="margin-bottom:18px;">Here's your starting build. Begin and you'll land on the daily hub — your first day starts now.</div>
    <div class="wz-recap">
      <div class="wz-recap-card">
        <div class="wz-recap-hero">
          <div class="av">${initialsOf(wiz.name)}</div>
          <div>
            <div style="font-size:22px;font-weight:800">${escapeHtml(wiz.name || 'Unnamed Hero')}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(wiz.tagline || 'No callsign set')}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div class="mono" style="font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase">Hero Level</div>
            <div style="font-size:28px;font-weight:800;color:var(--life)">1</div>
          </div>
        </div>
        <div style="font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Equipped classes</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${pills}</div>
        <div class="wz-recap-stats">
          <div class="wz-recap-stat" style="--c:var(--fit)"><div class="big">${totalEnabledQuests}</div><div class="lbl">Daily quests</div></div>
          <div class="wz-recap-stat" style="--c:var(--life)"><div class="big">${totalDailyXP}</div><div class="lbl">Max XP / day</div></div>
          <div class="wz-recap-stat" style="--c:var(--cyber)"><div class="big">${daysToExam}d</div><div class="lbl">To Sec+ exam</div></div>
        </div>
        <button class="wz-embark" data-w="embark">Begin Your Quest</button>
      </div>
      <div class="wz-recap-card">
        <div class="mono" style="font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px">Boss roster</div>
        ${bossRows.join('') || `<div style="color:var(--dim);font-size:13px">No bosses set yet — that's OK, you can add them later.</div>`}
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
          <div class="mono" style="font-size:11px;color:var(--dim);line-height:1.6;letter-spacing:.5px">
            💡 Tip: hit <strong style="color:var(--cyber)">End Day</strong> every night to lock streaks.
          </div>
        </div>
      </div>
    </div>`;
}

/* -------- Mobile wizard renderer -------- */
function renderMobileWizard() {
  const body =
    wiz.step === 0 ? mwzStepIdentity() :
    wiz.step === 1 ? mwzStepClasses() :
    wiz.step === 2 ? mwzStepBosses() :
    wiz.step === 3 ? mwzStepQuests() :
                     mwzStepEmbark();
  const stp = WIZ_STEPS.map((_, i) => `<span class="stp ${i < wiz.step ? 'done' : ''} ${i === wiz.step ? 'active' : ''}"></span>`).join('');
  const isLast = wiz.step === WIZ_STEPS.length - 1;
  const cta = isLast
    ? `<button class="mwiz-btn embark" data-w="embark">Begin Quest</button>`
    : `<button class="mwiz-btn primary" data-w="next" ${wizCanNext() ? '' : 'disabled'}>Continue</button>`;
  return `
    <div class="mwiz-scope">
      <div class="mwiz-prog">
        <span class="label">${String(wiz.step + 1).padStart(2, '0')} / 05</span>
        ${stp}
      </div>
      <div class="mwiz-body">${body}</div>
      <div class="mwiz-foot">
        ${wiz.step > 0 ? `<button class="mwiz-btn" data-w="back">Back</button>` : ''}
        ${cta}
      </div>
    </div>`;
}

function mwzStepIdentity() {
  return `
    <div class="mwiz-stp">Step 01 · Identity</div>
    <h1 class="mwiz-h">Name your <span class="ac">hero</span>.</h1>
    <div class="mwiz-av" id="wzAvatar">${initialsOf(wiz.name)}<span class="ring"></span></div>
    <div class="mwiz-lede">This sits above your avatar on the daily hub. Change it anytime.</div>
    <div class="mwiz-fld">
      <label>Hero name</label>
      <input type="text" data-w-input="name" data-autofocus value="${escapeHtml(wiz.name)}" placeholder="Mason, Cipher, Wraith…" />
    </div>
    <div class="mwiz-fld">
      <label>Callsign · optional</label>
      <input type="text" data-w-input="tagline" value="${escapeHtml(wiz.tagline)}" placeholder="The cert grind, the gym, the trenches." />
    </div>`;
}

function mwzStepClasses() {
  const all = [...BUILT_IN_CLASSES, ...wiz.customClasses];
  const cards = all.map(c => {
    const on = !!wiz.classes[c.id];
    const remove = c.custom ? `<button class="x-remove" data-w="remove-class" data-id="${c.id}">×</button>` : '';
    return `
      <div class="mwiz-class ${on ? 'on' : ''}" style="--c:${c.color}" data-w="toggle-class" data-id="${c.id}">
        ${remove}
        <div class="ic">${c.icon}</div>
        <div>
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="tag">${escapeHtml(c.tagline || '')}</div>
        </div>
        <div class="chk"></div>
      </div>`;
  }).join('');
  let addTile;
  if (wiz.showAddClass) {
    const a = wiz._addClass || { name: '', icon: CUSTOM_CLASS_ICONS[0], paletteId: CUSTOM_CLASS_PALETTE[0].id };
    const icons = CUSTOM_CLASS_ICONS.map(i => `<button class="${a.icon === i ? 'on' : ''}" data-w="pick-icon" data-icon="${i}">${i}</button>`).join('');
    const swatches = CUSTOM_CLASS_PALETTE.map(p => `<button class="${a.paletteId === p.id ? 'on' : ''}" style="--c:${p.color}" data-w="pick-palette" data-id="${p.id}"></button>`).join('');
    addTile = `
      <div class="mwiz-addclass-form">

function mwzStepEmbark() {
  const active = [...BUILT_IN_CLASSES, ...wiz.customClasses].filter(c => wiz.classes[c.id]);
  const daysToExam = Math.max(0, daysBetween(todayStr(), wiz.bosses.secPlusDate));
  const totalQuests = wizAllCats().reduce((n, c) => n + ((wiz.enabled[c.id]?.size) || 0), 0);
  const totalXP = wizAllCats().reduce((n, c) => {
    const en = wiz.enabled[c.id] || new Set();
    const all = [...(QUEST_TEMPLATES[c.id] || []), ...(wiz.customQuests[c.id] || [])];
    return n + all.filter(q => en.has(q.id)).reduce((s, q) => s + q.xp, 0);
  }, 0);
  const pills = active.map(c => `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;border:1px solid ${c.color};color:${c.color};font-size:11px;letter-spacing:1px;text-transform:uppercase">${c.icon} ${escapeHtml(c.name)}</span>`).join('');

    <div class="mwiz-stp">Step 05 · Embark</div>
    <h1 class="mwiz-h">Ready, <span class="ac">${escapeHtml(wiz.name || 'hero')}</span>?</h1>

      <div class="mwiz-recap-hero">
        <div class="av">${initialsOf(wiz.name)}</div>
        <div style="flex:1">
          <div style="font-size:17px;font-weight:700">${escapeHtml(wiz.name || 'Unnamed Hero')}</div>
          <div class="mono" style="font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1px">HERO LV 1</div>
        </div>
      </div>
      <div class="mwiz-recap-stats">
        <div class="s"><div class="v" style="color:var(--fit)">${totalQuests}</div><div class="l">Quests</div></div>
        <div class="s"><div class="v" style="color:var(--life)">${totalXP}</div><div class="l">XP / day</div></div>
        <div class="s"><div class="v" style="color:var(--cyber)">${daysToExam}d</div><div class="l">To exam</div></div>

/* ============================================================
   Desktop Hub renderer
   ============================================================ */

let hubNavTab = 'today';   // today | bosses | history | settings

function enterHub() {
  if (isMobile()) {
    document.getElementById('mhubRoot').hidden = false;
    document.getElementById('hubRoot').hidden = true;
    renderMobileHub();
  } else {
    document.getElementById('hubRoot').hidden = false;
    document.getElementById('mhubRoot').hidden = true;
    renderDesktopHub();
  }
}

function render() {
  if (!state.onboarded) { renderWizard(); return; }
  if (isMobile()) renderMobileHub();
  else renderDesktopHub();
}

function renderDesktopHub() {
  const root = document.getElementById('hubRoot');
  root.hidden = false;
  document.getElementById('mhubRoot').hidden = true;
  document.getElementById('wizardRoot').hidden = true;
  rollDateIfNeeded();

  if (hubNavTab === 'settings') {
    root.innerHTML = renderDesktopSettings();
    attachDesktopSettingsHandlers();
    return;
  }

  const todayObj = new Date(state.today + 'T00:00:00');
  const todayStrPretty = todayObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
  const greet = (() => {
    const h = new Date().getHours();
    return h < 5 ? 'Burning the midnight oil' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  })();
  const heroStreak = state.streaks.hero || 0;
  const totalXP = activeCombatClasses().reduce((n, c) => n + (state.xp[c.id] || 0), 0);
  const heroLevel = Math.floor(totalXP / 300) + 1;

  // Top nav
  const navHtml = ['today', 'bosses', 'history', 'settings'].map(t => `
    <button class="${hubNavTab === t ? 'on' : ''}" data-nav="${t}">${capitalize(t)}</button>`).join('');

  // Header
  const headerHtml = `
    <div class="hub-head">
      <div>
        <div class="hub-greet">${greet}</div>
        <div class="hub-greet-row">
          <div class="hub-avatar">${initialsOf(state.name)}<span class="ring"></span></div>
          <div>
            <div class="hub-name"><input type="text" id="playerName" value="${escapeHtml(state.name)}" /><span class="day">· Day ${heroStreak + 1}</span></div>
            <div class="hub-meta">
              <span class="mono">${todayStrPretty}</span>
              <span>Pick up where you left off.</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hub-stats">
        <div class="hub-stat"><div class="big life">${heroLevel}</div><div class="lbl">Hero Level</div></div>
        <div class="hub-stat"><div class="big warn">${heroStreak}<span style="font-size:14px;color:var(--dim);margin-left:4px">d</span></div><div class="lbl">Streak</div></div>
        <div class="hub-stat"><div class="big mono">${totalXP.toLocaleString()}</div><div class="lbl">Total XP</div></div>
      </div>
    </div>`;

  // Class strip
  const classCards = activeCombatClasses().map(c => {
    const xp = state.xp[c.id] || 0;
    const lvl = levelForXP(xp);
    const cur = xp - xpForLevel(lvl);
    const streak = state.streaks[c.id] || 0;
    const mult = multiplierFor(streak);
    return `
      <div class="hub-class" style="--c:${c.color}">
        <div class="top">
          <span class="dot"></span>
          <h3>${escapeHtml(c.name)}</h3>
          <div class="lvl"><span class="pre">LV</span>${lvl}</div>
        </div>
        <div class="hub-bar"><div style="width:${cur}%"></div></div>
        <div class="meta">
          <span>${cur} / 100 XP</span>
          <span>×${mult.toFixed(2)} mult</span>
          <span class="streak">${streak}d streak</span>
        </div>
      </div>`;
  }).join('');

  // === Body content depends on nav tab ===
  let bodyHtml;
  if (hubNavTab === 'today') bodyHtml = renderHubToday();
  else if (hubNavTab === 'bosses') bodyHtml = renderHubBosses();
  else if (hubNavTab === 'history') bodyHtml = renderHubHistory();

  root.innerHTML = `
    <div class="hub">
      <div class="hub-top">
        <div class="hub-mark"><span class="dot"></span><span>Life Quest</span></div>
        <div class="hub-nav">${navHtml}</div>
        <div class="hub-top-right">
          <button class="theme-btn" data-action="toggle-theme" title="${state.theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}" aria-label="${state.theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}">${state.theme === 'light' ? '🌙' : '☀️'}</button>
          <span class="hub-sync" data-sync><span data-sync-label>…</span></span>
          <span class="hub-email" id="signedInEmail">${escapeHtml(_signedInEmail || 'local mode')} ${_signedInEmail ? '<a href="/cdn-cgi/access/logout">sign out</a>' : ''}</span>
        </div>
      </div>
      ${headerHtml}
      <div class="hub-classes">${classCards || '<div style="padding:24px;color:var(--dim);font-size:13px;text-align:center;width:100%;">No classes equipped — visit Settings to add some.</div>'}</div>
      ${bodyHtml}
    </div>`;

  attachDesktopHubHandlers();
  setSyncStatus(pendingPush ? 'syncing' : (_signedInEmail ? 'synced' : 'offline'));
}

function renderHubToday() {
  const date = getSelectedDate();
  const viewingToday = isViewingToday();
  const c = state.completions[date] || {};
  const totalDoneToday = Object.values(c).reduce((n, arr) => n + (arr || []).length, 0);

  // Date selector + back pill
  const dPretty = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const pastBanner = viewingToday ? '' : `
    <div style="background:var(--surface-2);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
      <span style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--warn);font-family:'JetBrains Mono',monospace;font-weight:700;">Editing past day · ${dPretty}</span>
      <span style="font-size:11px;color:var(--dim);">XP adjusts at base value · streaks unchanged</span>
      <button class="hub-btn" style="margin-left:auto" data-action="back-to-today">← Back to today</button>
    </div>`;
  const dateRow = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px;">
      <span>VIEWING</span>
      <input type="date" id="hubDatePicker" value="${date}" max="${state.today}" style="background:var(--input-bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--text);font:inherit;font-size:11px;font-family:'JetBrains Mono',monospace;" />
      ${viewingToday ? '<span style="color:var(--good);">● TODAY</span>' : `<button class="hub-btn ghost" data-action="back-to-today" style="padding:4px 10px;font-size:11px;">JUMP TO TODAY</button>`}
    </div>`;

  // Quest groups
  const cats = activeQuestCats();
  const groups = cats.map(cat => {
    const list = state.quests[cat.id] || [];
    const doneCount = (c[cat.id] || []).length;
    const weighIn = (cat.id === 'fit' && viewingToday) ? renderHubWeighIn() : '';
    const items = list.map(q => {
      const done = isDone(cat.id, q.id);
      return `
        <div class="hub-q ${done ? 'on' : ''}" data-toggle="${cat.id}|${q.id}">
          <span class="chk"></span>
          <span class="lbl">${escapeHtml(q.label)}</span>
          <span class="xp">+${q.xp}</span>
        </div>`;
    }).join('') || `<div style="color:var(--dim);font-size:12px;padding:6px 0;">No quests in this category yet. Add some from Settings.</div>`;
    return `
      <div class="hub-qgroup" style="--c:${cat.color}">
        <div class="gh">${escapeHtml(cat.name)} <span class="num">${doneCount} / ${list.length}</span></div>
        ${weighIn}
        ${items}
      </div>`;
  }).join('');

  // Bosses (right column)
  const bossesHtml = bossList().map(b => {
    const cls = b.finalCls ? 'final' : (b.classId || '');
    const action = b.action ? `<button class="boss-action" data-boss-action="${b.id}">${escapeHtml(b.action)}</button>` : '';
    const cssVar = b.finalCls ? `--c:var(--fit)` : (b.classId === 'content' ? '--c:var(--content)' : '--c:var(--muted)');
    return `
      <div class="hub-boss">
        <div class="top">
          <span class="name">${escapeHtml(b.name)}</span>
          <span class="tag ${cls}">${escapeHtml(b.tag)}</span>
        </div>
        <div class="hub-bossbar" style="${cssVar}"><div style="width:${100 - b.hp}%"></div></div>
        <div class="meta"><span>${b.hpLabel}</span><span>${b.meta}</span></div>
        ${action}
      </div>`;
  }).join('') || `<div style="color:var(--dim);font-size:12px;padding:6px 0;">No bosses — visit Settings to add some.</div>`;

  // Heatmap — clickable to jump to that day
  const heatCells = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(state.today + 'T00:00:00'); d.setDate(d.getDate() - i);
    const k = todayStr(d);
    const cc = state.completions[k] || {};
    const count = Object.values(cc).reduce((n, arr) => n + (arr || []).length, 0);
    let cls = '';
    if (count >= 1) cls = 'l1';
    if (count >= 4) cls = 'l2';
    if (count >= 8) cls = 'l3';
    if (count >= 12) cls = 'l4';
    if (k === state.today) cls += ' today';
    if (k === date) cls += ' today'; // also highlight the currently-viewed day
    heatCells.push(`<div class="c ${cls}" data-heatjump="${k}" title="${k} — ${count} quests · click to edit" style="cursor:pointer"></div>`);
  }

  // Achievements
  const achHtml = ACHIEVEMENTS.map(a => {
    const un = !!state.achievements[a.id];
    return `<div class="a ${un ? 'un' : ''}"><span class="ic">${a.ico}</span><div><div class="t">${escapeHtml(a.title)}</div><div class="d">${escapeHtml(a.desc)}</div></div></div>`;
  }).join('');

  return `
    <div class="hub-grid">
      <div class="hub-col">
        <div class="hub-h"><h2>Daily Quests</h2><span class="count mono">${totalDoneToday} done</span></div>
        ${dateRow}
        ${pastBanner}
        ${groups}
        <div class="hub-actions">
          <button class="hub-btn primary" data-action="endDay" ${viewingToday ? '' : 'disabled title="End Day only works on today"'}>End Day · Lock Streak</button>
          <button class="hub-btn ghost" data-action="resetToday">${viewingToday ? 'Reset today' : 'Reset this day'}</button>
        </div>
      </div>
      <div class="hub-col">
        <div class="hub-h"><h2>Boss Fights</h2><span class="count mono">${bossList().length} active</span></div>
        ${bossesHtml}
        <div class="hub-h divider"><h2>Last 14 Days</h2><span class="count mono">${state.streaks.hero || 0}d streak</span></div>
        <div class="hub-heat">${heatCells.join('')}</div>
        <div class="hub-heat-key"><span>less</span><span class="k"></span><span class="k l1"></span><span class="k l2"></span><span class="k l3"></span><span class="k l4"></span><span>more</span></div>
        <div class="hub-h divider"><h2>${viewingToday ? "Today's Notes" : 'Notes · ' + dPretty}</h2></div>
        <div class="hub-notes"><textarea id="hubNotes" placeholder="Wins, ideas, what to film tomorrow…">${escapeHtml(state.notes[date] || '')}</textarea></div>
      </div>
      <div class="hub-col">
        <div class="hub-h"><h2>Achievements</h2><span class="count mono">${Object.keys(state.achievements).length} / ${ACHIEVEMENTS.length}</span></div>
        <div class="hub-ach">${achHtml}</div>
        <div class="hub-h divider"><h2>Lifetime</h2></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;">

function renderHubWeighIn() {
  const w = state.weights[state.today] || {};
  const d = new Date(state.today + 'T00:00:00');
  const yest = new Date(d); yest.setDate(yest.getDate() - 1);
  const yw = state.weights[todayStr(yest)] || {};
  let deltaStr = '—', deltaCls = '';
  if (typeof w.am === 'number' && typeof yw.am === 'number') {
    const diff = w.am - yw.am;
    deltaStr = (diff >= 0 ? '+' : '') + diff.toFixed(1);
    deltaCls = diff > 0.05 ? 'up' : '';
  }
  return `
    <div class="hub-weigh">
      <div><label>AM weight</label><input type="number" step="0.1" min="0" id="wAM" value="${w.am ?? ''}" placeholder="lbs" /></div>
      <div><label>PM weight</label><input type="number" step="0.1" min="0" id="wPM" value="${w.pm ?? ''}" placeholder="lbs" /></div>
      <div class="delta"><div class="v ${deltaCls}">${deltaStr}</div><span class="l">delta lb</span></div>
    </div>`;
}

function renderHubHistory() {
  // Build a longer 8-week heatmap
  const cells = [];
  for (let i = 7 * 8 - 1; i >= 0; i--) {
    const d = new Date(state.today + 'T00:00:00'); d.setDate(d.getDate() - i);
    const k = todayStr(d);
    const cc = state.completions[k] || {};
    const count = Object.values(cc).reduce((n, arr) => n + (arr || []).length, 0);
    let cls = '';
    if (count >= 1) cls = 'l1';
    if (count >= 4) cls = 'l2';
    if (count >= 8) cls = 'l3';
    if (count >= 12) cls = 'l4';
    if (k === state.today) cls += ' today';
    cells.push(`<div class="c ${cls}" title="${k} — ${count} quests"></div>`);
  }
  return `
    <div class="hub-grid" style="grid-template-columns:1fr;">
      <div class="hub-col">
        <div class="hub-h"><h2>Last 8 Weeks</h2><span class="count mono">hero streak ${state.streaks.hero || 0}d</span></div>
        <div class="hub-heat" style="grid-template-columns:repeat(${7 * 8}, 1fr);">${cells.join('')}</div>
        <div class="hub-heat-key" style="margin-top:8px;"><span>less</span><span class="k"></span><span class="k l1"></span><span class="k l2"></span><span class="k l3"></span><span class="k l4"></span><span>more</span></div>
      </div>
    </div>`;
}

function attachDesktopHubHandlers() {
  const root = document.getElementById('hubRoot');
  // Top nav
  root.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => { hubNavTab = el.dataset.nav; render(); });
  });
  // Date picker (past-day editing)
  const dp = root.querySelector('#hubDatePicker');
  if (dp) {
    dp.addEventListener('change', () => { setSelectedDate(dp.value); render(); });
  }
  // Heatmap cells — click to jump to that day in Today view
  root.querySelectorAll('[data-heatjump]').forEach(el => {
    el.addEventListener('click', () => {
      setSelectedDate(el.dataset.heatjump);
      hubNavTab = 'today';
      render();
    });
  });
  // Quest toggles
  root.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const [cat, id] = el.dataset.toggle.split('|');
      toggleQuest(cat, id);
    });
  });
  // Boss actions
  root.querySelectorAll('[data-boss-action]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.bossAction;
      const b = bossList().find(x => x.id === id);
      if (b && b.onAction) b.onAction();
    });
  });
  // End/reset day, back-to-today, theme toggle, etc.
  root.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.dataset.action;
      if (action === 'endDay') {
        if (!isViewingToday()) { toast('NOT TODAY', 'Switch to today to end the day.'); return; }
        endDay();
      } else if (action === 'resetToday') {
        resetToday();
      } else if (action === 'back-to-today') {
        setSelectedDate(state.today); render();
      } else {
        // Theme toggle, redo-onboarding, export/import/hardReset, etc.
        handleSettingsAction(action, el);
      }
    });
  });
  // Player name
  const pn = root.querySelector('#playerName');
  if (pn) {
    pn.addEventListener('input', e => {
      state.name = e.target.value || 'Hero';
      save();
      const av = root.querySelector('.hub-avatar');
      if (av) av.firstChild.textContent = initialsOf(state.name);
    });
  }
  // Notes — keyed to selectedDate so notes for past days are editable too
  const notes = root.querySelector('#hubNotes');
  if (notes) {
    notes.addEventListener('input', e => {
      const d = getSelectedDate();
      state.notes[d] = e.target.value;
      save();
    });
  }
  // Weigh-in
  const wireWeigh = (id, key) => {
    const el = root.querySelector('#' + id);
    if (!el) return;
    el.addEventListener('change', () => {
      state.weights[state.today] = state.weights[state.today] || {};
      const raw = el.value.trim();
      if (raw === '') delete state.weights[state.today][key];
      else {
        const v = parseFloat(raw);
        if (isFinite(v) && v > 0) state.weights[state.today][key] = v;
      }
      save();
      render();
    });
  };
  wireWeigh('wAM', 'am');
  wireWeigh('wPM', 'pm');
}
