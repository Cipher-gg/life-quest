services:
  lifequest:
    build: .
    image: life-quest:latest
    container_name: life-quest
    restart: unless-stopped
    # No host port mapping — the app is only reachable via the cloudflared
    # tunnel, which talks to it over the internal Docker network. This means
    # nothing on your LAN can bypass Cloudflare Access.
    expose:
      - "80"
    depends_on:
      - api

  api:
    build: ./api
    image: life-quest-api:latest
    container_name: life-quest-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Your Cloudflare Zero Trust team domain, e.g. mycompany.cloudflareaccess.com
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      # The Application Audience (AUD) tag from the Cloudflare Access dashboard
      # (Zero Trust -> Access -> Applications -> your app -> Overview).
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      - DB_PATH=/data/users.db
    volumes:
      - lifequest-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: life-quest-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - lifequest

volumes:
  lifequest-data:
