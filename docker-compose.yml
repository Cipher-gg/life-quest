services:
  lifequest:
    build: .
    image: life-quest:latest
    container_name: life-quest
    restart: unless-stopped
    ports:
      # Host port : container port. Change the host port if 8080 is in use.
      - "8080:80"

  # Optional: run cloudflared in the same stack so the tunnel comes up
  # alongside the app. To enable:
  #   1. Create a tunnel in the Cloudflare Zero Trust dashboard
  #      (Networks -> Tunnels -> Create a tunnel -> Cloudflared).
  #   2. Copy the connector token.
  #   3. Put it in a `.env` file next to this compose file:
  #        TUNNEL_TOKEN=eyJh...your-token...
  #   4. In the Cloudflare dashboard, add a public hostname for the tunnel
  #      that points to:  http://lifequest:80
  #      (service name "lifequest" resolves via Docker's internal DNS).
  #   5. Uncomment the block below and run: docker compose up -d
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: life-quest-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   depends_on:
  #     - lifequest
